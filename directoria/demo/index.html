:root {
  /* Marca (tokens.json) */
  --pizarra: #17322C;        /* fondo oscuro, títulos y lo confirmado */
  --pizarra-2: #21433B;      /* tarjetas sobre pizarra */
  --pizarra-linea: #2E5A50;  /* bordes sobre pizarra, viñetas y rótulos sobre salvia */
  --tiza: #F6F3EC;           /* fondo claro principal */
  --salvia: #E7EEE9;         /* fondo claro secundario: menú, lo hecho y lo que es para saber */
  --papel: #FFFDF8;          /* tarjetas */
  --linea: #D5DED9;          /* bordes y separadores decorativos */
  --texto: #41524D;          /* texto de lectura sobre claro */
  --texto-suave: #C9DAD4;    /* texto de lectura sobre pizarra */
  --chispa: #E07A3A;         /* la IA sobre oscuro: punta de la insignia y foco sobre pizarra */
  --chispa-texto: #B4531C;   /* la IA sobre claro: antetítulo y anillo de foco */
  --chispa-suave: #FBE6D8;   /* fondo de los avisos y los choques (estado, no categoría) */
  /* Borde de los campos que se rellenan: 3,5:1 sobre papel y 3,2:1 sobre tiza (WCAG 1.4.11). No está en tokens.json. */
  --borde-campo: #7A8C85;

  /* Paleta de apoyo (solo en la aplicación; propuesta en tokens-apoyo.json). Cinco tonos que casan con la pizarra y la
     chispa: ni azules ni morados (regla 8 de la marca: nada de la «IA de moda») ni naranjas (el naranja es de la IA).
     Cada uno en tres pasos: tinte (fondo claro: el disco de los iconos y de las marcas de la agenda, a 4 o más de la
     salvia salvo el granate, que no cabe en sRGB), medio (el aro de los iconos, los puntos y los bordes: 3:1 o más sobre
     papel, tiza y su tinte) y tinta (texto y marcas del calendario: 4,5:1 o más sobre papel, tiza y su tinte; también
     sobre salvia, 6:1 o más, y sobre linea, 5:1 o más). Los medios están validados como paleta categórica
     (validate_palette.js), también con todos los pares a la vez. El correo y la comunicación no tienen tono. */
  --turquesa-tinte: #CEFAFE;  /* personas, guardias y el día: fondo del icono */
  --turquesa-medio: #0398A1;  /* 3,4:1 sobre papel; 3,2:1 sobre tiza; 3,1:1 sobre su tinte */
  --turquesa-tinta: #026167;  /* 7,1:1 sobre papel; 6,4:1 sobre su tinte */
  --granate-tinte: #FDE8EE;   /* documentos y firmas: fondo del icono. Rosa muy claro: a 4,4 del tinte rosa */
  --granate-medio: #84383D;   /* 7,9:1 sobre papel; 6,9:1 sobre su tinte. Rojo vino apagado: ni rojo de error ni chispa */
  --granate-tinta: #70252C;   /* 10,4:1 sobre papel; 9,0:1 sobre su tinte */
  --mostaza-tinte: #FAF4CD;   /* plazos y calendario: fondo del icono */
  --mostaza-medio: #9D8B09;   /* 3,4:1 sobre papel; 3,1:1 sobre su tinte y sobre tiza. Amarillo, no naranja */
  --mostaza-tinta: #615604;   /* 7,3:1 sobre papel; 6,6:1 sobre su tinte */
  --rosa-tinte: #FDD6DC;      /* protocolos y convivencia: fondo del icono, el más rosado */
  --rosa-medio: #CB5672;      /* 4,0:1 sobre papel; 3,1:1 sobre su tinte */
  --rosa-tinta: #86374B;      /* 7,8:1 sobre papel; 5,9:1 sobre su tinte */
  --verde-tinte: #E0FBDC;     /* las funciones de recursos (gastos, banco y material): fondo del icono */
  --verde-medio: #0B7B00;     /* 5,4:1 sobre papel; 4,9:1 sobre su tinte. Verde hoja: lejos de la pizarra */
  --verde-tinta: #2C6427;     /* 7,0:1 sobre papel; 6,4:1 sobre su tinte */

  /* Transparencias de la marca, para no dejar colores sueltos en las reglas */
  --tiza-velo: rgb(246 243 236 / .16);   /* tramo vacío de un medidor sobre pizarra */
  --foco-halo: rgb(180 83 28 / .25);     /* halo del campo de texto con el foco (chispa-texto) */
  --velo: rgb(23 50 44 / .45);           /* fondo detrás de la ventana de confirmación (pizarra) */

  /* Papeles de la marca (manual: tokens semánticos del tema claro) */
  --fondo: var(--tiza);           /* fondo de la página */
  --superficie: var(--papel);     /* tarjetas y ventanas */
  --borde: var(--linea);          /* bordes decorativos */
  --tinta: var(--pizarra);        /* títulos, nombres y datos */
  --cuerpo: var(--texto);         /* texto de lectura */
  --acento: var(--chispa-texto);  /* el antetítulo, la voz de la IA */
  --foco: var(--chispa-texto);    /* anillo de foco: 3,8:1 o más sobre papel, tiza, salvia, chispa-suave y los tintes */

  --f-tit: 'Rubik', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-txt: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;

  --t-xs: .8125rem;
  --t-s: .875rem;
  --t-m: 1rem;
  --t-l: 1.125rem;
  --t-xl: 1.375rem;
  --t-2xl: 1.75rem;
  --t-3xl: clamp(1.875rem, 1.4rem + 1.6vw, 2.5rem);

  --radio-s: .5rem;
  --radio: .875rem;
  --radio-l: 1.25rem;
  --sombra: 0 1px 2px rgb(23 50 44 / .05), 0 14px 36px -12px rgb(23 50 44 / .18);        /* sombra de pizarra: papel, ficha y globo */
  --sombra-suave: 0 1px 2px rgb(23 50 44 / .04), 0 6px 18px -10px rgb(23 50 44 / .16);  /* sombra de pizarra al pasar el ratón */
  --cabecera: 4rem;
  --menu: 15.5rem;
  color-scheme: light;
}

/* ---------- Color por significado ----------
   Un tono por tipo de trabajo, el mismo en toda la app y nunca por posición. El motor pone data-cat: el color dice adónde
   lleva una pieza (su función) y el icono, de qué trata. Lo reservado lo dicen la banda y el candado, no el color. Lo que lleva al correo
   («comunicacion») o a ningún sitio va sin tono, en los colores de la marca. En la pantalla de acceso, data-perfil: el tono
   de la función principal de cada perfil (jefatura y quien sustituye comparten la turquesa: las guardias y la ficha).
   Cada pieza pinta con --cat-tinte, --cat-medio y --cat-tinta; sin tono, con los colores de la marca. Los estados (hecho,
   pendiente, aviso, para saber) no usan estos tonos: van en pizarra, salvia y chispa-suave, siempre con icono y texto.
   El panel del día es de personas y guardias. «Lo que te necesita» y «Lo que viene» mezclan tipos: su cabecera va sin
   tono, y cada fila y cada marca llevan el de la función a la que llevan. */
[data-cat="personas"], [data-perfil="jefatura"], [data-perfil="sustituto"], .panel-dia { --cat-tinte: var(--turquesa-tinte); --cat-medio: var(--turquesa-medio); --cat-tinta: var(--turquesa-tinta); }
[data-cat="documentos"], [data-perfil="direccion"] { --cat-tinte: var(--granate-tinte); --cat-medio: var(--granate-medio); --cat-tinta: var(--granate-tinta); }
[data-cat="plazos"], [data-perfil="docente"] { --cat-tinte: var(--mostaza-tinte); --cat-medio: var(--mostaza-medio); --cat-tinta: var(--mostaza-tinta); }
[data-cat="protocolos"], [data-perfil="orientacion"] { --cat-tinte: var(--rosa-tinte); --cat-medio: var(--rosa-medio); --cat-tinta: var(--rosa-tinta); }
[data-cat="recursos"], [data-perfil="secretaria"] { --cat-tinte: var(--verde-tinte); --cat-medio: var(--verde-medio); --cat-tinta: var(--verde-tinta); }
/* Sin tono: el correo y la comunicación (donde escribe la IA: su único color es la chispa) y los estados de la lista y de
   la agenda (lo hecho y los choques van con el icono de su estado). No heredan el tono de lo que los rodea. */
[data-cat="comunicacion"], .fila.hecha, .fila.choque, .ag-item.hecha, .ag-item.choque { --cat-tinte: initial; --cat-medio: initial; --cat-tinta: initial; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--cuerpo);
  font: 400 var(--t-m)/1.55 var(--f-txt);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--papel); }
[hidden] { display: none !important; }
img { max-width: 100%; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-tit); color: var(--tinta); text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.marco { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cifra { font-variant-numeric: tabular-nums; }

/* ---------- Piezas comunes ---------- */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 2.75rem; padding: .625rem 1.25rem;
  border: 2px solid var(--pizarra); border-radius: 999px;
  background: var(--pizarra); color: var(--tiza);
  font-family: var(--f-txt); font-size: var(--t-m); font-weight: 700; line-height: 1.2; text-decoration: none;
  transition: background-color .18s ease, border-color .18s ease, color .18s ease;
}
.boton:hover { background: var(--pizarra-2); border-color: var(--pizarra-2); }
.boton-borde { background: transparent; color: var(--tinta); }
.boton-borde:hover { background: var(--pizarra); border-color: var(--pizarra); color: var(--tiza); }
.boton-suave { background: var(--salvia); border-color: var(--salvia); color: var(--tinta); }
.boton-suave:hover { background: var(--linea); border-color: var(--linea); color: var(--tinta); }
.boton-pequeno { min-height: 2.25rem; padding: .375rem .875rem; font-size: var(--t-s); }
.boton[disabled], .boton[aria-disabled="true"] { opacity: .42; cursor: not-allowed; }
.boton[disabled]:hover { background: var(--pizarra); border-color: var(--pizarra); }
.boton-borde[disabled]:hover { background: transparent; color: var(--tinta); }
.enlace { padding: 0; border: 0; background: none; color: var(--tinta); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--linea); }
.enlace:hover { text-decoration-color: var(--pizarra); }

.antetitulo { margin: 0; font-size: var(--t-s); font-weight: 700; letter-spacing: .02em; line-height: 1.3; color: var(--acento); display: flex; align-items: center; gap: .5rem; }
.antetitulo::before { content: ""; flex: none; width: 1.25rem; height: 2px; border-radius: 2px; background: currentColor; }
.titulo-vista { margin-top: .5rem; font-size: var(--t-3xl); font-weight: 600; line-height: 1.12; letter-spacing: -.015em; }
.entradilla { margin-top: .75rem; max-width: 44rem; font-size: var(--t-l); line-height: 1.55; color: var(--cuerpo); }

.insignia { display: inline-block; flex: none; width: 1.25rem; height: 1.25rem; vertical-align: middle; }
.con-insignia { display: inline-flex; align-items: center; gap: .5rem; font-size: var(--t-s); font-weight: 700; color: var(--tinta); }
.con-insignia.suave { font-weight: 600; color: var(--cuerpo); }

.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-l); padding: 1.25rem 1.375rem; min-width: 0; }
.tarjeta > h2, .tarjeta > h3 { font-size: var(--t-l); font-weight: 600; line-height: 1.25; }
.tarjeta-cabeza { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; margin-bottom: .875rem; }
/* Acento de cabecera de las tarjetas: un punto del tono delante del título, como los del menú. Sin filos ni bordes de
   color a un lado (componente Tarjeta de la marca). En el Inicio solo lo lleva el día (personas y guardias): «Lo que te
   necesita» y «Lo que viene» mezclan tipos y van sin punto. En una función, sus tarjetas, salvo las del correo y la
   comunicación (sin tono) y las que llevan la insignia de la IA: ahí el único color es la chispa. */
.panel-dia > .panel-cabeza > h2::before,
main[data-cat]:not([data-cat="comunicacion"]) .tarjeta:not(:has(.insignia)) > :is(h2, h3)::before,
main[data-cat]:not([data-cat="comunicacion"]) .tarjeta:not(:has(.insignia)) > .tarjeta-cabeza > :is(h2, h3)::before,
main[data-cat]:not([data-cat="comunicacion"]) .principal-dentro > section:not(.tarjeta) > h2::before {
  content: ""; display: inline-block; width: .625rem; height: .625rem; margin-right: .5rem; border-radius: 50%;
  background: var(--cat-medio); vertical-align: .06em;
}

.pastilla { display: inline-flex; align-items: center; gap: .375rem; padding: .125rem .625rem; border-radius: 999px; font-size: var(--t-xs); font-weight: 700; line-height: 1.5; white-space: nowrap; }
/* Estados, en los colores de la marca y siempre con su glifo: hoy (reloj), pendiente o plazo (borde, «…» o banderín),
   para saber («i»), hecho (✓) y aviso o falta (triángulo, en chispa-suave). Ninguno usa un tono de categoría. */
.pastilla .glifo { width: .8125rem; height: .8125rem; }
.p-hoy { background: var(--pizarra); color: var(--tiza); }
.p-plazo, .p-pendiente, .p-pronto, .p-revisar, .p-curso { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 1.5px var(--pizarra-linea); }
.p-info, .p-despues { background: var(--salvia); color: var(--tinta); }
.p-hecho, .p-ok { background: var(--salvia); color: var(--tinta); }
.p-aviso, .p-falta { background: var(--chispa-suave); color: var(--pizarra); --hueco: var(--chispa-suave); }
.visto { display: inline-block; flex: none; width: 1.125rem; height: 1.125rem; }
.p-hecho .visto, .p-ok .visto { width: .95rem; height: .95rem; }

.aviso { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem 1rem; border-radius: var(--radio); background: var(--chispa-suave); color: var(--pizarra); --hueco: var(--chispa-suave); }
.aviso > .glifo { width: 1.125rem; height: 1.125rem; margin-top: .2rem; }
.aviso.info { background: var(--salvia); --hueco: var(--salvia); }
.aviso.ok { background: var(--salvia); --hueco: var(--salvia); }
.aviso strong { font-weight: 700; }

.nota-ia { display: flex; gap: .625rem; align-items: flex-start; padding: .75rem .875rem; border-radius: var(--radio); background: var(--salvia); color: var(--tinta); font-size: var(--t-s); }

.confidencial { display: flex; align-items: center; gap: .75rem; padding: .625rem 1rem; border-radius: var(--radio); background: var(--pizarra); color: var(--tiza); font-size: var(--t-s); font-weight: 700; }
.confidencial img { width: 2rem; height: 2rem; }

.campo-casilla { display: flex; gap: .625rem; align-items: flex-start; padding: .375rem 0; cursor: pointer; color: var(--tinta); }
.campo-casilla input { flex: none; width: 1.25rem; height: 1.25rem; margin: .15rem 0 0; accent-color: var(--pizarra); cursor: pointer; }

.pestanas { display: flex; flex-wrap: wrap; gap: .375rem; padding: .25rem; border-radius: 999px; background: var(--salvia); width: fit-content; max-width: 100%; }
.pestana { min-height: 2.25rem; padding: .375rem 1rem; border: 0; border-radius: 999px; background: transparent; color: var(--tinta); font-weight: 700; font-size: var(--t-s); }
.pestana[aria-pressed="true"] { background: var(--papel); box-shadow: var(--sombra-suave); }

/* ---------- Acceso ---------- */
.acceso { min-height: 100%; display: grid; grid-template-columns: minmax(18rem, 26rem) minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "arriba perfiles" "abajo perfiles"; }
.acceso-banda { background: var(--pizarra); color: var(--texto-suave); display: flex; flex-direction: column; gap: 2rem; }
.acceso-arriba { grid-area: arriba; padding-block: 2.5rem 1rem; }
.acceso-abajo { grid-area: abajo; padding-block: 1rem 2.5rem; }
.acceso-banda .logo { width: 11rem; height: auto; display: block; }
.acceso-banda h1 { color: var(--tiza); font-size: clamp(1.75rem, 1.3rem + 1.4vw, 2.25rem); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.acceso-banda .lema { margin-top: .75rem; font-size: var(--t-l); line-height: 1.5; }
.recorrido { display: grid; gap: .25rem; }
.recorrido h2 { color: var(--tiza); font-size: var(--t-l); font-weight: 600; margin-bottom: .5rem; }
.recorrido ol { list-style: none; display: grid; gap: .5rem; counter-reset: paso; }
.recorrido li { counter-increment: paso; }
.recorrido button {
  width: 100%; display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; align-items: start; text-align: left;
  padding: .75rem .875rem; border: 1px solid var(--pizarra-linea); border-radius: var(--radio); background: var(--pizarra-2); color: var(--texto-suave);
  transition: border-color .18s ease, background-color .18s ease;
}
.recorrido button:hover { border-color: var(--texto-suave); }
.recorrido button:focus-visible { outline-color: var(--chispa); }
/* El número del paso, en el tono de su perfil: disco del tinte con su aro y la cifra en la tinta. Sobre la banda oscura
   (pizarra-2), el aro va entre dos bandas del tinte, como el icono de la urgente: la primera sombra se pinta encima, así
   que quedan 2 px de tinte por fuera, 2,5 px de aro y el tinte dentro. */
.recorrido button::before {
  content: counter(paso); display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  background: var(--cat-tinte, var(--tiza)); color: var(--cat-tinta, var(--pizarra)); font-family: var(--f-tit); font-weight: 600; font-size: var(--t-s);
  box-shadow: inset 0 0 0 2px var(--cat-tinte, var(--tiza)), inset 0 0 0 4.5px var(--cat-medio, var(--tiza));
}
.recorrido b { display: block; color: var(--tiza); font-weight: 700; }
.recorrido span { display: block; font-size: var(--t-s); line-height: 1.45; }
.acceso-pie { margin-top: auto; display: grid; gap: .75rem; font-size: var(--t-s); }
.acceso-pie .lema-corto { font-family: var(--f-tit); font-weight: 500; font-size: var(--t-l); color: var(--tiza); }
.acceso-banda .boton-borde { color: var(--tiza); border-color: var(--texto-suave); align-self: flex-start; }
.acceso-banda .boton-borde:hover { background: var(--tiza); border-color: var(--tiza); color: var(--pizarra); }
.acceso-banda .boton-borde:focus-visible { outline-color: var(--chispa); }

.acceso-perfiles { grid-area: perfiles; padding-block: 2.5rem 3rem; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 1.75rem; }
.acceso-perfiles .cabeza { display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem; max-width: 46rem; }
.acceso-perfiles h2 { font-size: var(--t-3xl); font-weight: 600; line-height: 1.12; letter-spacing: -.015em; }
.chip-demo { display: inline-flex; align-items: center; gap: .5rem; width: fit-content; padding: .25rem .75rem; border-radius: 999px; background: var(--salvia); color: var(--tinta); font-size: var(--t-s); font-weight: 700; }
.perfiles { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 1rem; max-width: 64rem; }
/* Cada perfil, con su tono (data-perfil): un punto delante del cargo, la persona en su tinta y el subrayado de «Entrar
   en su panel». La ilustración va tal cual, sobre su disco linea (sin halo: la marca no retoca las ilustraciones), y la
   tarjeta, sin filo de color. El mismo tono numera su paso en el recorrido. */
.perfil {
  width: 100%; height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: .375rem; text-align: left;
  padding: 1.25rem; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--superficie);
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.perfil:hover { border-color: var(--pizarra-linea); box-shadow: var(--sombra); transform: translateY(-2px); }
.perfil img { width: 5.5rem; height: 5.5rem; margin-bottom: .375rem; }
.perfil .cargo { font-family: var(--f-tit); font-weight: 600; font-size: var(--t-xl); color: var(--tinta); line-height: 1.2; }
.perfil .cargo::before { content: ""; display: inline-block; width: .75rem; height: .75rem; margin-right: .5rem; border-radius: 50%; background: var(--cat-medio, var(--pizarra-linea)); vertical-align: .06em; }
.perfil .quien { font-size: var(--t-s); font-weight: 700; color: var(--cat-tinta, var(--tinta)); }
.perfil .que { font-size: var(--t-s); line-height: 1.45; color: var(--cuerpo); }
.perfil .entrar { margin-top: .5rem; font-weight: 700; color: var(--tinta); text-decoration: underline; text-decoration-color: var(--cat-medio, var(--linea)); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.perfil:hover .entrar { text-decoration-color: var(--cat-tinta, var(--pizarra)); }
.acceso-nota { max-width: 46rem; font-size: var(--t-s); color: var(--cuerpo); }

/* ---------- App ---------- */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 1rem; min-height: var(--cabecera);
  background: var(--papel); border-bottom: 1px solid var(--borde);
}
.cabecera .logo-boton { display: flex; align-items: center; gap: .75rem; padding: .25rem; border: 0; background: none; border-radius: var(--radio-s); }
.cabecera .logo { width: 8.5rem; height: auto; display: block; }
.cabecera .colegio { font-size: var(--t-s); font-weight: 700; color: var(--tinta); padding-left: .75rem; border-left: 1px solid var(--borde); white-space: nowrap; }
.cabecera .relleno { flex: 1; }
.chip-servidor { display: inline-flex; align-items: center; gap: .5rem; padding: .25rem .75rem; border-radius: 999px; background: var(--salvia); color: var(--tinta); font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }
.chip-servidor img { width: 1.5rem; height: 1.5rem; }
.chip-hora { font-size: var(--t-xs); font-weight: 700; color: var(--cuerpo); white-space: nowrap; }
.usuario { display: flex; align-items: center; gap: .625rem; min-width: 0; }
.usuario img { width: 2.5rem; height: 2.5rem; flex: none; }
.usuario .nombre { font-weight: 700; color: var(--tinta); font-size: var(--t-s); line-height: 1.2; }
.usuario .cargo { font-size: var(--t-xs); color: var(--cuerpo); line-height: 1.2; }
.usuario > div { min-width: 0; }

.cuerpo { display: grid; grid-template-columns: var(--menu) minmax(0, 1fr); min-height: 0; }
.menu { background: var(--salvia); border-right: 1px solid var(--borde); padding: 1.25rem .875rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.menu nav ul { list-style: none; display: grid; gap: .25rem; }
.menu nav a {
  display: flex; align-items: center; justify-content: space-between; gap: .625rem;
  min-height: 2.75rem; padding: .5rem .875rem; border-radius: var(--radio);
  color: var(--tinta); font-weight: 600; text-decoration: none;
}
/* Un punto de color por función (su tipo de trabajo), con un filo en la tinta de su tono: sobre salvia, la mostaza y la
   turquesa no llegan a 3:1 (2,90 y 2,96), y el filo da 6:1 o más. El Inicio y el correo, sin tono, no llevan punto:
   dejan su hueco para que los nombres queden alineados. En la que está abierta, el punto lleva además un aro de tiza. */
.menu nav a::before { content: ""; flex: none; width: .625rem; height: .625rem; border-radius: 50%; background: var(--cat-medio, transparent); box-shadow: inset 0 0 0 1.5px var(--cat-tinta, transparent); }
.menu nav a:not([data-cat])::before, .menu nav a[data-cat="comunicacion"]::before { visibility: hidden; }
.menu nav a > span:first-of-type { flex: 1; min-width: 0; }
.menu nav a:hover { background: var(--papel); }
.menu nav a[aria-current="page"] { background: var(--pizarra); color: var(--tiza); }
.menu nav a[aria-current="page"]::before { box-shadow: inset 0 0 0 1.5px var(--cat-tinta, transparent), 0 0 0 2px var(--tiza); }
.menu nav a[aria-current="page"] .contador { background: var(--tiza); color: var(--pizarra); }
.contador { min-width: 1.5rem; padding: 0 .4rem; border-radius: 999px; background: var(--papel); color: var(--tinta); font-size: var(--t-xs); font-weight: 700; text-align: center; line-height: 1.6; }
.menu .grupo { padding: 0 .875rem; font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pizarra-linea); }
.menu-pie { margin-top: auto; display: grid; gap: .75rem; padding: 1rem .875rem 0; border-top: 1px solid var(--borde); font-size: var(--t-s); }
.menu-pie .lema-corto { font-family: var(--f-tit); font-weight: 500; color: var(--tinta); font-size: var(--t-m); }
.menu-pie .enlace { justify-self: start; }

.principal { min-width: 0; padding-block: 2rem 4rem; }
.principal-dentro { max-width: 76rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
.cabeza-vista { display: grid; grid-template-columns: minmax(0, 1fr); gap: .125rem; }
/* Cabecera de una función: el icono de color de su tipo de trabajo delante del título, del alto de su primera línea */
.cabeza-vista.con-icono { grid-template-columns: auto minmax(0, 1fr); column-gap: .875rem; }
.cabeza-vista.con-icono > * { grid-column: 1 / -1; }
.cabeza-vista.con-icono > .ico { grid-column: 1; align-self: start; margin-top: .5rem; font-size: var(--t-3xl); width: 1.12em; height: 1.12em; }
.cabeza-vista.con-icono > .titulo-vista { grid-column: 2; }
[data-foco]:focus { outline: none; }
html:has(.principal-inicio) { scroll-padding-top: calc(var(--cabecera) + env(safe-area-inset-top, 0px) + .75rem); }
/* Si una pantalla no se puede pintar */
.fallo { display: grid; gap: 1rem; justify-items: start; max-width: 44rem; padding-block: 3rem; }
.lectura, .impacto, .dictado-panel, .adaptado, .formulario, .version, .enviado, .editor, .recorrido, .lateral { grid-template-columns: minmax(0, 1fr); }

/* Inicio */
/* Formato de bloques: las tarjetas se reparten en columnas, una debajo de otra, para que no queden huecos entre tarjetas de distinta altura. */
.bloques { columns: 26rem 2; column-gap: 1rem; }
.bloques > .tarjeta { break-inside: avoid; margin-bottom: 1rem; }
.items { list-style: none; display: grid; gap: .25rem; }
.item { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; align-items: start; padding: .625rem 0; border-top: 1px solid var(--borde); }
.item:first-child { border-top: 0; padding-top: 0; }
/* Con su glifo, «Para saber» mide unos 6,75rem: todas las pastillas de la columna, igual de anchas */
.item .pastilla { margin-top: .125rem; min-width: 6.75rem; justify-content: center; }
.item .texto { color: var(--tinta); line-height: 1.5; }
.item .ir { grid-column: 2; justify-self: start; font-size: var(--t-s); }
.origen-inicio { margin-top: .75rem; }

/* Inicio: panel de mando. La cabecera con la persona, cifras que llevan a donde se actúa, el día por sesiones,
   lo que te necesita y lo que viene. Cifras, día y calendario salen de reglas y de los datos del colegio: sin insignia.
   La insignia de la IA solo va en lo que escribe un modelo de lenguaje: resúmenes de correo y plazos sacados de un correo
   o de una circular. Un solo tono para las magnitudes (la pizarra); el estado, siempre con icono o forma y texto.
   La chispa no va en ningún icono: es solo de la insignia de la IA. */
.principal-inicio { padding-top: 1.25rem; }
/* En una pantalla Full HD (1920 px), el panel llega hasta 96rem: no se queda pegado al menú con un hueco a la derecha */
.principal-inicio .principal-dentro { gap: 1.25rem; max-width: 96rem; }

/* Cabecera: el saludo con una línea de entradilla y, a la derecha, la ilustración de la persona (120 px; 136 px desde 1500 px; 104 px en tableta; en el móvil no va) */
.cabeza-inicio { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1.5rem; }
.cabeza-inicio-texto { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; min-width: 0; }
.cabeza-inicio .antetitulo { display: block; text-wrap: balance; }
.cabeza-inicio .antetitulo::before { display: inline-block; vertical-align: middle; margin: -.15em .5rem 0 0; }
.cabeza-inicio .origen { color: var(--cuerpo); font-weight: 600; }
.cabeza-inicio .titulo-vista { margin-top: 0; }
.cabeza-inicio .entradilla { margin-top: 0; max-width: none; }
/* El disco de la ilustración deja un margen transparente de 8 px (16 de 240): el margen negativo lo aprovecha,
   así la cabecera no crece por el dibujo y las cifras y la fila del día suben. */
.cabeza-ilus { display: block; width: 7.5rem; height: 7.5rem; margin-block: -.5rem; }
@media (min-width: 1500px) { .cabeza-ilus { width: 8.5rem; height: 8.5rem; } }

.panel { display: grid; gap: 1.25rem; min-width: 0; container: panel / inline-size; }
/* Los iconos de interfaz siguen la marca: trazo redondo en pizarra (Iconografía). El tono de su tipo de trabajo va en el
   disco: relleno del tinte y un aro del medio de 2,25 unidades de 24 (3 px en un icono de 32). El trazo del aro va
   centrado en el borde del círculo y el icono se recorta en círculo (clip-path), no en el cuadrado del SVG: así el disco
   queda redondo y el aro, igual de ancho en todo el borde. 3:1 o más sobre el tinte, la tiza y el papel. Sin tono, o si
   son un estado (✓ hecho, «i» para saber, triángulo de un choque), trazo pizarra sobre salvia, sin aro. */
.ico { display: inline-block; flex: none; width: 2.25rem; height: 2.25rem; clip-path: circle(50%); }
.ico-fondo { fill: var(--cat-tinte, var(--salvia)); stroke: var(--cat-medio, none); stroke-width: 4.5; }
.ico-trazo { fill: none; stroke: var(--pizarra); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico-trazo .f { fill: var(--pizarra); stroke: none; }
.flecha { width: 1rem; height: 1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Glifos de estado y formas del calendario: toman el color del texto; el hueco, el del fondo en que están */
.glifo { display: inline-block; flex: none; width: 1rem; height: 1rem; }
.glifo .trazo { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.glifo .grueso { stroke-width: 2.2; }
.glifo .relleno { fill: currentColor; }
.glifo .hueco { fill: none; stroke: var(--hueco, var(--papel)); stroke-width: 1.6; stroke-linecap: round; }
.glifo .hueco-f { fill: var(--hueco, var(--papel)); }
/* Lo que ha escrito la IA: la insignia y «Resumido con IA», «Sacado del correo»… */
.marca-ia { display: inline-flex; align-items: center; gap: .375rem; width: fit-content; font-size: var(--t-xs); font-weight: 600; line-height: 1.3; color: var(--cuerpo); }
.marca-ia .insignia { width: 1rem; height: 1rem; }

/* Medidor (un tramo por elemento) y tramos con nombre (pasos del dictado, días de una cuenta atrás) */
.medidor { display: flex; gap: 3px; width: 100%; }
.medidor i { flex: 1; height: .625rem; border-radius: 999px; background: var(--linea); box-shadow: inset 0 0 0 1px var(--borde-campo); }
.indicador-barra .medidor i { height: .75rem; }
.medidor i.lleno { background: var(--pizarra); box-shadow: none; }
.medidor i.revisar { background: transparent; box-shadow: inset 0 0 0 2px var(--pizarra); }
/* El borde discontinuo, en un rectángulo de esquinas suaves: en una píldora estrecha los trazos se rompen en las curvas */
.medidor i.falta { background: transparent; box-shadow: none; border: 1.5px dashed var(--pizarra); border-radius: 4px; }
.tramos { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: .375rem; font-size: var(--t-xs); font-weight: 700; line-height: 1.2; color: var(--cuerpo); }
.tramos > span { display: grid; gap: .3125rem; min-width: 0; white-space: nowrap; }
.tramos > span::before { content: ""; height: .75rem; border-radius: 999px; background: var(--linea); box-shadow: inset 0 0 0 1px var(--borde-campo); }
.tramos .hecho::before, .tramos .queda::before { background: var(--pizarra); box-shadow: none; }
.tramos .queda, .tramos .actual { color: var(--tinta); }
.tramos .actual::before { background: transparent; box-shadow: inset 0 0 0 2px var(--pizarra); }
/* Aire entre «Dictar», «Revisar» y «Enviar» */
.tramos.pasos { gap: .75rem; }

/* Cifras: dos por fila en el móvil y todas en una fila con sitio. Las filas de dentro (etiqueta, cifra, medidor,
   nota y acción) se alinean entre tarjetas con subgrid, así que la nota y la acción empiezan a la misma altura. */
.indicadores { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: .75rem; row-gap: 0; margin-bottom: -.75rem; }
.indicadores > li { display: grid; grid-row: span 5; grid-template-rows: subgrid; row-gap: 0; min-width: 0; margin-bottom: .75rem; }
@container panel (width < 52rem) { .indicadores > li.entera { grid-column: 1 / -1; } }
@container panel (width >= 52rem) {
  .indicadores { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); column-gap: 1rem; margin-bottom: 0; }
  .indicadores > li { margin-bottom: 0; }
}
.indicador {
  grid-row: 1 / -1; display: grid; grid-template-rows: subgrid; row-gap: .375rem; min-width: 0;
  padding: .875rem 1rem 1rem; border: 1px solid var(--borde); border-radius: var(--radio-l);
  background: var(--papel); color: var(--cuerpo); text-decoration: none;
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
.indicador:hover { border-color: var(--pizarra-linea); box-shadow: var(--sombra-suave); }
/* Cada cifra, con el tono de la función a la que lleva: el disco y el aro de su icono y el subrayado de su acción. Los
   medidores y las cuentas atrás siguen en pizarra: son magnitudes, y su forma (lleno, con borde, discontinuo) dice el
   estado. La urgente, en pizarra. */
.indicador[data-cat]:not(.es-hoy) .indicador-accion > span { text-decoration-color: var(--cat-medio, var(--linea)); }
.indicador[data-cat]:not(.es-hoy):hover .indicador-accion > span { text-decoration-color: currentColor; }
.indicador-cabeza { display: flex; align-items: center; gap: .625rem; min-width: 0; color: var(--tinta); font-size: var(--t-s); font-weight: 700; line-height: 1.25; }
.indicador-cabeza .ico { width: 2rem; height: 2rem; }
.indicador-etiqueta { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.junto { white-space: nowrap; }
/* align-content: la línea del valor va arriba aunque otra tarjeta tenga la fila más alta: las cifras no se escalonan */
.indicador-fila { display: flex; flex-wrap: wrap; align-items: last baseline; align-content: flex-start; gap: .25rem .5rem; min-width: 0; }
.indicador-valor { font-family: var(--f-tit); font-weight: 600; font-size: clamp(2rem, 1.55rem + 1.3vw, 2.75rem); line-height: 1; letter-spacing: -.02em; color: var(--tinta); }
.indicador-valor small { font-size: .5em; font-weight: 500; letter-spacing: 0; }
/* Un valor en palabras («Por dictar», «En espera») va un poco más pequeño que una cifra, para que quepa en una línea. */
/* La misma caja que una cifra: «Por dictar» y «Por enviar» quedan a la altura de los números de al lado. */
.indicador-valor.largo { font-size: clamp(1.625rem, 1.35rem + .9vw, 2.25rem); line-height: clamp(2rem, 1.55rem + 1.3vw, 2.75rem); }
.indicador-rotulo { flex: 0 1 auto; min-width: 0; font-size: var(--t-xs); font-weight: 700; line-height: 1.3; color: var(--tinta); }
/* Un rótulo largo («para avisar, antes del sáb 21») va al lado de la cifra si le queda sitio; si no, debajo */
.indicador-rotulo.largo { flex: 1 1 6.25rem; }
.indicador-fila .pastilla { margin-left: auto; align-self: center; }
.indicador-hecho { display: flex; align-items: center; gap: .5rem; font-family: var(--f-tit); font-weight: 600; font-size: var(--t-xl); line-height: 1.2; color: var(--tinta); }
.indicador-hecho .visto { width: 1.75rem; height: 1.75rem; }
/* Lo hecho no se corta a media palabra: si una no cabe, se parte con guion (la página va en español) */
.indicador-hecho > span { min-width: 0; overflow-wrap: normal; hyphens: auto; }
.indicador-barra { display: block; min-width: 0; }
/* Sin medidor, la nota sube a su fila: no queda un hueco entre la cifra y la nota. La acción sigue en la última fila,
   alineada con las de las otras tarjetas. */
.indicador-barra:empty { display: none; }
.indicador-barra:empty + .indicador-nota { grid-row: 3 / span 2; }
.indicador-accion { grid-row: 5; }
.indicador-nota { display: grid; gap: .25rem; align-content: start; font-size: var(--t-s); line-height: 1.45; color: var(--cuerpo); text-wrap: pretty; }
.indicador-nota .linea { display: block; }
.indicador-accion { align-self: end; padding-top: .125rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: var(--t-s); font-weight: 700; color: var(--tinta); }
.indicador-accion > span { min-width: 0; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--linea); }
.indicador:hover .indicador-accion > span { text-decoration-color: currentColor; }
.accion-corta { display: none; }
.indicador.es-hoy { background: var(--pizarra); border-color: var(--pizarra); color: var(--texto-suave); }
.indicador.es-hoy:hover { background: var(--pizarra-2); border-color: var(--pizarra-2); }
.indicador.es-hoy .indicador-cabeza, .indicador.es-hoy .indicador-valor, .indicador.es-hoy .indicador-rotulo, .indicador.es-hoy .indicador-accion { color: var(--tiza); }
.indicador.es-hoy .indicador-nota, .indicador.es-hoy .marca-ia { color: var(--texto-suave); }
.indicador.es-hoy .indicador-accion > span { text-decoration-color: var(--pizarra-linea); }
.indicador.es-hoy:hover .indicador-accion > span { text-decoration-color: currentColor; }
/* La urgente sigue en pizarra; solo su icono lleva el tono de su tipo de trabajo (disco del tinte con su aro y trazo
   pizarra, como en las demás). Sobre pizarra, y sobre pizarra-2 con el ratón encima, el medio del granate, del verde y
   del rosa apenas se separa del fondo: el aro va entre dos bandas del tinte. El fondo del icono es el tinte, y el círculo
   con su aro se encoge al 80 %: una banda de 1,2 unidades fuera, el aro (2,4) y el tinte dentro. Sin tono, disco
   pizarra-linea y trazo tiza. */
.indicador.es-hoy[data-cat]:not([data-cat="comunicacion"]) .ico { background: var(--cat-tinte); }
.indicador.es-hoy[data-cat]:not([data-cat="comunicacion"]) .ico-fondo { stroke-width: 3; transform: scale(.8); transform-origin: 12px 12px; }
.indicador.es-hoy:not([data-cat]) .ico-fondo, .indicador.es-hoy[data-cat="comunicacion"] .ico-fondo { fill: var(--pizarra-linea); }
.indicador.es-hoy:not([data-cat]) .ico-trazo, .indicador.es-hoy[data-cat="comunicacion"] .ico-trazo { stroke: var(--tiza); }
.indicador.es-hoy:not([data-cat]) .ico-trazo .f, .indicador.es-hoy[data-cat="comunicacion"] .ico-trazo .f { fill: var(--tiza); }
.indicador.es-hoy .p-hoy { background: var(--tiza); color: var(--pizarra); }
/* En pizarra: lo hecho, en tiza; lo actual, con borde de tiza; lo pendiente, un tono apagado con un filo claro (en el
   medidor y en los pasos del dictado), para que «0 de 4» y «Revisar · Enviar» se vean en el proyector (3:1) */
.indicador.es-hoy .medidor i { background: var(--tiza-velo); box-shadow: inset 0 0 0 1px var(--texto-suave); }
.indicador.es-hoy .tramos > span::before { background: var(--tiza-velo); box-shadow: inset 0 0 0 1px var(--texto-suave); }
.indicador.es-hoy .medidor i.lleno, .indicador.es-hoy .tramos .hecho::before, .indicador.es-hoy .tramos .queda::before { background: var(--tiza); box-shadow: none; }
.indicador.es-hoy .medidor i.revisar { background: transparent; box-shadow: inset 0 0 0 2px var(--tiza); }
.indicador.es-hoy .medidor i.falta { background: transparent; box-shadow: none; border-color: var(--tiza); }
.indicador.es-hoy .tramos { color: var(--texto-suave); }
.indicador.es-hoy .tramos .actual, .indicador.es-hoy .tramos .queda { color: var(--tiza); }
.indicador.es-hoy .tramos .actual::before { background: transparent; box-shadow: inset 0 0 0 2px var(--tiza); }
/* En el móvil, las tarjetas de media fila: menos margen, el icono más pequeño y la acción corta (no se parte) */
@container panel (width < 32rem) {
  .indicador { padding: .875rem .875rem 1rem; row-gap: .375rem; }
  .indicador-cabeza { align-items: flex-start; gap: .5rem; }
  .indicador-cabeza .ico { width: 1.875rem; height: 1.875rem; }
  .indicadores > li:not(.entera) .accion-larga.con-corta { display: none; }
  .indicadores > li:not(.entera) .accion-corta { display: inline; }
  /* En media tarjeta no cabe el reloj de «Hoy» junto a la cifra («10:15»): queda la palabra, en la tarjeta pizarra */
  .indicadores > li:not(.entera) .p-hoy .glifo { display: none; }
}
/* Lo hecho en media tarjeta («Al día», «Visto bueno dado»): un poco más pequeño, para que no se salga */
@container panel (width < 52rem) {
  .indicadores > li:not(.entera) .indicador-hecho { font-size: var(--t-l); }
  .indicadores > li:not(.entera) .indicador-hecho .visto { width: 1.5rem; height: 1.5rem; }
}
/* A 360 px o menos, algo menos de margen en las tarjetas y en el calendario; a 320, lo hecho un poco más pequeño */
@container panel (width < 21rem) {
  .indicador { padding-inline: .75rem; }
  .indicador-cabeza { gap: .375rem; }
  .indicador-cabeza .ico { width: 1.5rem; height: 1.5rem; }
  .indicadores > li:not(.entera) .indicador-hecho { font-size: var(--t-m); gap: .375rem; }
  .indicadores > li:not(.entera) .indicador-hecho .visto { width: 1.25rem; height: 1.25rem; }
}
@container panel (width < 19rem) {
  .indicadores > li:not(.entera) .indicador-hecho { font-size: var(--t-m); }
}

/* Cabeza de cada bloque del panel */
.panel-cabeza { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .875rem; margin-bottom: .875rem; }
.panel-cabeza h2 { font-size: var(--t-l); font-weight: 600; line-height: 1.25; }
.panel-nota { margin-left: auto; font-size: var(--t-s); color: var(--cuerpo); }
/* «Son las 8:00 · clases desde las 9:00»: en salvia; el chispa-suave queda para los avisos */
.ahora { display: inline-flex; align-items: center; gap: .375rem; padding: .1875rem .625rem; border-radius: 999px; background: var(--salvia); color: var(--tinta); font-size: var(--t-xs); font-weight: 700; line-height: 1.4; }
.ahora .glifo { width: .875rem; height: .875rem; }
.dia-aviso { display: flex; gap: .5rem; align-items: flex-start; margin: -.125rem 0 .875rem; color: var(--tinta); font-size: var(--t-s); font-weight: 600; line-height: 1.45; }
.dia-aviso .glifo { margin-top: .15em; }
/* Sin una palabra sola en la última línea de una nota, un detalle o un aviso */
.dia-aviso > span { text-wrap: pretty; }
/* Lo que cambia en tu día porque jefatura te ha elegido para otra sesión (siElegido): bajo la rejilla, con el triángulo */
.carril-aviso { margin: .625rem 0 0; padding: 0 .875rem; }
.carril-aviso + .carril-aviso { margin-top: .375rem; }

/* El día: una columna por sesión, como el horario del colegio (con sitio); en filas por debajo de 62rem */
.horario { display: grid; gap: .375rem; }
.horario-cabeza, .carril-sesiones { display: grid; grid-template-columns: var(--cols); column-gap: .25rem; min-width: 0; }
.carril-sesiones { list-style: none; }
/* Si no cabe (con más espaciado de texto, WCAG 1.4.12), la hora baja de línea en lugar de cortarse */
.horario-cabeza .franja { min-width: 0; padding: 0 .375rem; font-size: var(--t-xs); line-height: 1.3; color: var(--cuerpo); }
.horario-cabeza .franja b { font-family: var(--f-tit); font-weight: 600; font-size: var(--t-s); color: var(--tinta); }
.carril { display: grid; gap: .375rem; }
.carril + .carril { margin-top: .625rem; }
.carril-titulo { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .625rem; color: var(--cuerpo); font-size: var(--t-s); line-height: 1.35; }
.carril-titulo .ico { width: 1.75rem; height: 1.75rem; }
.carril-titulo > b { font-family: var(--f-tit); font-weight: 600; font-size: var(--t-m); color: var(--tinta); }
.carril-cuenta { margin-left: auto; display: inline-flex; align-items: center; gap: .625rem; color: var(--tinta); }
.carril-cuenta .medidor { width: 5.5rem; }
.carril-cuenta .medidor i { height: .5rem; }
.sesion { position: relative; display: flex; flex-direction: column; gap: .3125rem; min-width: 0; min-height: 5.25rem; padding: .4375rem .375rem .5rem; container-type: inline-size; border-radius: var(--radio-s); background: var(--salvia); color: var(--cuerpo); font-size: var(--t-xs); line-height: 1.3; }
.sesion-franja { display: none; }
.sesion-texto { display: grid; gap: .0625rem; min-width: 0; }
/* Los nombres y las materias no se parten con guion; como mucho, en dos líneas */
.sesion-texto b { color: var(--tinta); font-size: var(--t-s); font-weight: 700; line-height: 1.25; hyphens: none; overflow-wrap: normal; }
.sesion-detalle { color: var(--cuerpo); }
.sesion-cambio { margin-top: auto; display: grid; gap: .125rem; color: var(--tinta); }
.sesion-estado { display: flex; align-items: flex-start; gap: .25rem; font-weight: 700; color: var(--tinta); }
.sesion-estado .glifo, .sesion-estado .visto { width: .9375rem; height: .9375rem; margin-top: .05em; }
.sesion-quien { color: var(--tinta); }
.persona { white-space: nowrap; }
/* En la rejilla, el nombre va siempre en su propia línea («Cubre / Pablo Sanz», «Propuesta: / Rosa Medina») y el texto
   de debajo, equilibrado («Confirmada / a las 8:01»): así el ✓ y «Por confirmar» quedan a la misma altura en todas las celdas. */
@container panel (width >= 62rem) {
  .sesion-estado .persona, .sesion-quien .persona { display: block; }
  .sesion-quien { text-wrap: balance; }
}
/* Con la rejilla en columnas, el estado de cada celda con cambio va arriba de su zona, en una fila que comparten todas
   las celdas del carril (subgrid), y no pegado abajo: así el «…» y el ✓ quedan a la misma altura aunque debajo lleven
   distinto número de líneas (confirmando una a una, «Elección: Rosa Medina», «Ya no la cubres · La cubre…»).
   Una celda que hace de subgrid no puede ser un contenedor de tamaño: container-type normal. */
@container panel (width >= 62rem) {
  .carril-sesiones { grid-template-rows: auto auto; }
  .carril-sesiones > .sesion { grid-row: span 2; }
  .carril-sesiones > .sesion:has(> .sesion-cambio) { display: grid; grid-template-rows: subgrid; container-type: normal; }
  .sesion-texto { align-content: start; }
  .sesion-cambio { margin-top: 0; align-self: start; }
}
.nombre-corto { display: none; }
@container (max-width: 4.875rem) { .persona .nombre-largo { display: none; } .persona .nombre-corto { display: inline; } }
/* «Con su especialista» se quita si no cabe en una línea: la celda sigue diciendo la materia (y el globo, el resto) */
@container (max-width: 6.95rem) { .sesion.t-igual .sesion-detalle { display: none; } }
/* Sin cambios: salvia plano, sin borde. Aviso: chispa suave. Por confirmar: tinte suave y borde discontinuo. Confirmada: pizarra. */
.sesion.t-aviso { background: var(--chispa-suave); }
.sesion.t-aviso .glifo { --hueco: var(--chispa-suave); }
.sesion.por-confirmar { background: var(--tiza); border: 1.5px dashed var(--pizarra); padding: calc(.4375rem - 1.5px) calc(.375rem - 1.5px) calc(.5rem - 1.5px); }
.sesion.confirmada { background: var(--pizarra); color: var(--texto-suave); }
.sesion.confirmada .sesion-texto b, .sesion.confirmada .sesion-detalle, .sesion.confirmada .sesion-estado, .sesion.confirmada .sesion-quien { color: var(--tiza); }
.sesion.confirmada .visto circle { fill: var(--tiza); }
.sesion.confirmada .visto path { stroke: var(--pizarra); }
.sesion.vacia { background: var(--tiza); min-height: 0; }
/* Una pausa en la que no hay nada (la comida): un separador fino */
.sesion.separador { min-height: 0; padding: 0; background: none; }
.sesion.separador::before { content: ""; position: absolute; top: .375rem; bottom: .375rem; left: 50%; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--linea); }
.sesion.juntas { display: none; }
.sesion[tabindex]:hover { box-shadow: inset 0 0 0 2px var(--pizarra); }
.sesion.por-confirmar[tabindex]:hover { border-style: solid; box-shadow: none; }
.sesion.confirmada[tabindex]:hover { box-shadow: inset 0 0 0 2px var(--tiza), 0 0 0 1px var(--pizarra); }
.sesion:focus-visible { outline-offset: 2px; border-radius: .5rem; }
.carril-estado { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; margin-top: .75rem; padding: .5rem .875rem; border-radius: var(--radio); background: var(--tiza); color: var(--tinta); font-size: var(--t-s); font-weight: 600; line-height: 1.4; }
.carril-estado > p { flex: 1 1 16rem; min-width: 0; text-wrap: pretty; }
.carril-estado.hecho { background: var(--salvia); }
.carril-estado > .glifo, .carril-estado > .visto { width: 1.25rem; height: 1.25rem; }
.atajo { display: inline-flex; align-items: center; gap: .375rem; min-height: 2rem; color: var(--tinta); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--pizarra-linea); }
.atajo:hover { text-decoration-color: var(--pizarra); }
@container panel (width < 62rem) {
  .horario-cabeza { display: none; }
  .carril-sesiones { grid-template-columns: minmax(0, 1fr); gap: .25rem; }
  .sesion { grid-column: auto !important; display: grid; grid-template-columns: 5.25rem minmax(0, 1fr); align-items: center; gap: .125rem .75rem; min-height: 3.25rem; padding: .5rem .75rem; }
  .sesion.por-confirmar { padding: calc(.5rem - 1.5px) calc(.75rem - 1.5px); }
  .sesion-franja { display: grid; grid-row: 1 / span 2; color: var(--tinta); font-family: var(--f-tit); font-weight: 600; font-size: var(--t-s); line-height: 1.2; }
  .sesion-franja span { font-family: var(--f-txt); font-weight: 600; font-size: var(--t-xs); color: var(--cuerpo); white-space: nowrap; }
  .sesion-texto, .sesion-cambio { grid-column: 2; }
  .sesion-cambio { margin-top: 0; }
  .sesion.confirmada .sesion-franja, .sesion.confirmada .sesion-franja span { color: var(--tiza); }
  .sesion.separador, .sesion.vacia, .sesion.junta { display: none; }
  .sesion.juntas { display: grid; grid-template-columns: minmax(0, 1fr); }
  .sesion.juntas .sesion-texto { grid-column: 1; }
}

/* Lo que te necesita: los grupos (Hoy, Esta semana, Para saber) en columnas; en el móvil, uno debajo de otro */
.grupos { display: grid; gap: 1rem; }
/* Con dos grupos desiguales, el motor da más ancho al que tiene más filas (--cols-grupos) */
@container panel (min-width: 50rem) { .grupos { grid-template-columns: var(--cols-grupos, repeat(var(--g, 3), minmax(0, 1fr))); gap: 1rem 2rem; } }
.grupo-titulo { display: flex; align-items: center; margin-bottom: .125rem; font-family: var(--f-txt); font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pizarra-linea); }
.grupo-cuenta { white-space: pre; }
/* Lo que oye el lector de pantalla va en minúscula: si hereda las mayúsculas, algunos sintetizadores deletrean */
.grupo-titulo .sr { text-transform: none; letter-spacing: normal; }
.grupo-cuenta .glifo { width: .875rem; height: .875rem; margin-right: .25rem; vertical-align: -.125rem; }
.filas { list-style: none; display: grid; }
.fila + .fila { border-top: 1px solid var(--borde); }
.fila-dentro { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto auto; align-items: center; gap: .25rem .75rem; min-height: 3.5rem; padding: .625rem .5rem; margin: 0 -.5rem; border-radius: var(--radio); color: var(--cuerpo); text-decoration: none; }
a.fila-dentro:hover, a.ag-dentro:hover { background: var(--tiza); }
a.fila-dentro:hover .fila-texto b, a.ag-dentro:hover .fila-texto b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--linea); }
.fila-hecho { display: block; margin-top: .25rem; }
.fila-texto { display: grid; gap: .125rem; min-width: 0; }
.fila-texto b { color: var(--tinta); font-weight: 700; line-height: 1.3; }
.fila-texto > span:not(.sr) { font-size: var(--t-s); line-height: 1.45; text-wrap: pretty; }
.fila-texto > .marca-ia { margin-top: .125rem; font-size: var(--t-xs); }
.fila-dentro .flecha, .ag-dentro .flecha { color: var(--pizarra-linea); }
.fila.hecha .fila-texto b, .ag-item.hecha .fila-texto b { color: var(--cuerpo); }
/* Lo hecho y los choques son estados: su icono (✓, triángulo) va en los colores de la marca, no en el de su categoría
   (ver «Color por significado», arriba). */
.chip-fecha { padding: .125rem .5rem; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--pizarra-linea); color: var(--tinta); font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }
/* Un choque: tarjeta de aviso en chispa suave, con el triángulo y la palabra «Choque» */
.fila.choque, .fila.choque + .fila { border-top: 0; }
.fila.choque .fila-dentro, .ag-item.choque .ag-dentro { margin-top: .25rem; margin-bottom: .25rem; background: var(--chispa-suave); }
.fila.choque a.fila-dentro:hover, .ag-item.choque a.ag-dentro:hover { background: var(--chispa-suave); box-shadow: inset 0 0 0 2px var(--pizarra); }
.fila.choque .ico-fondo { fill: var(--papel); }
.etiqueta-choque { font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pizarra); }
.ag-item.choque .ag-forma { background: var(--papel); --hueco: var(--papel); }
.ag-item.choque, .ag-item.choque + .ag-item { border-top: 0; }

/* Lo que viene: el calendario al lado de la agenda; con sitio, la agenda en dos columnas */
.agenda-cuerpo { display: grid; gap: 1.25rem; }
@container panel (min-width: 50rem) {
  .agenda-cuerpo { grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr); gap: 2.25rem; align-items: start; }
  /* Con la agenda en una columna larga, el calendario la acompaña al bajar: no queda un hueco debajo */
  .minical-caja { position: sticky; top: calc(var(--cabecera) + env(safe-area-inset-top, 0px) + 1rem); }
}
.minical-caja { display: grid; gap: .5rem; }
.minical { width: calc(100% + 6px); max-width: 25rem; margin: -3px; table-layout: fixed; border-collapse: separate; border-spacing: 3px; font-size: var(--t-s); }
.minical th { padding: 0 0 .125rem; border: 0; background: none; text-align: center; font-size: var(--t-xs); font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--cuerpo); }
.minical td { height: 2.75rem; padding: 0; border: 0; border-radius: .5rem; background: var(--tiza); text-align: center; vertical-align: middle; color: var(--tinta); font-weight: 700; }
.minical td.finde { background: transparent; }
.minical td.pasado { background: transparent; color: var(--cuerpo); font-weight: 400; }
.minical td.hoy { background: var(--pizarra); color: var(--tiza); }
.minical small { font-size: var(--t-xs); }
.minical-num, .minical-dia { display: grid; place-items: center; align-content: center; gap: 2px; width: 100%; height: 100%; min-height: 2.75rem; }
.minical-dia { padding: 0; border: 0; border-radius: .5rem; background: var(--salvia); color: var(--tinta); font: inherit; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--pizarra-linea); --hueco: var(--salvia); }
.minical-dia:hover { background: var(--linea); --hueco: var(--linea); }
.formas { display: flex; gap: 2px; justify-content: center; }
.formas .glifo { width: .75rem; height: .75rem; }
.leyenda { display: flex; flex-wrap: wrap; gap: .375rem 1rem; font-size: var(--t-xs); color: var(--cuerpo); }
.leyenda > span { display: inline-flex; align-items: center; gap: .375rem; }
.leyenda .glifo { width: .875rem; height: .875rem; color: var(--tinta); --hueco: var(--papel); }
/* Con cuatro o cinco formas, la leyenda no cabe en una línea: va en dos filas parejas («Plazo · Cita, salida o fecha» y
   «Aviso · Hoy»; con «Hecho», «Plazo · Cita… · Aviso» y «Hecho · Hoy»), nunca con «Hoy» solo en la segunda. Si no caben,
   las columnas se estrechan y el texto baja de línea dentro de la suya. */
.leyenda:has(> span:nth-child(4)) { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); }
.leyenda:has(> span:nth-child(5)) { grid-template-columns: repeat(3, minmax(0, max-content)); }
.muestra-hoy { width: .875rem; height: .875rem; border-radius: .25rem; background: var(--pizarra); }

.agenda { list-style: none; display: grid; gap: .875rem; }
.ag-dia { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr); gap: .25rem .875rem; align-items: start; border-radius: var(--radio); }
.ag-dia:focus { outline: 3px solid var(--foco); outline-offset: 3px; }
.ag-fecha { display: grid; justify-items: center; overflow: hidden; border: 1.5px solid var(--pizarra); border-radius: .625rem; background: var(--papel); color: var(--tinta); line-height: 1.1; text-align: center; }
.ag-fecha > span { width: 100%; padding: .1875rem 0; background: var(--pizarra); color: var(--tiza); font-size: var(--t-xs); font-weight: 700; }
.ag-fecha b { padding-top: .25rem; font-family: var(--f-tit); font-size: var(--t-xl); font-weight: 600; }
.ag-fecha small { padding-bottom: .3125rem; font-size: var(--t-xs); font-weight: 700; color: var(--cuerpo); }
.ag-contenido { display: grid; min-width: 0; }
/* Cuándo es, contado desde hoy: «Mañana · 11:45», «La semana que viene» */
.ag-cuando { font-family: var(--f-txt); font-size: var(--t-xs); font-weight: 700; line-height: 1.3; letter-spacing: .02em; color: var(--pizarra-linea); }
.ag-items { list-style: none; display: grid; }
.ag-item + .ag-item { border-top: 1px solid var(--borde); }
.ag-dentro { display: grid; grid-template-columns: 1.625rem minmax(0, 1fr) auto; align-items: center; gap: .25rem .625rem; min-height: 2.75rem; padding: .375rem .5rem; margin: 0 -.5rem; border-radius: var(--radio); color: var(--cuerpo); text-decoration: none; }
/* Las marcas de la agenda: su forma dice qué es (banderín, calendario, triángulo, ✓) y su color, el tipo de trabajo de la
   función a la que llevan. Van dentro de un disco de su tono, como los iconos de las filas: el tinte, un aro del medio
   (3:1 o más sobre su tinte; los medios son los validados como paleta categórica) y la forma en la tinta (6:1 o más).
   Si llevan al correo o a ningún sitio, y si son un estado (lo hecho), disco salvia sin aro y forma en la tinta de la
   marca; el choque, disco papel sobre su fondo de aviso. */
.ag-forma {
  display: inline-grid; place-items: center; align-self: start; width: 1.625rem; height: 1.625rem; margin-top: -.125rem; border-radius: 50%;
  background: var(--cat-tinte, var(--salvia)); box-shadow: inset 0 0 0 2.5px var(--cat-medio, transparent); color: var(--cat-tinta, var(--tinta));
  --hueco: var(--cat-tinte, var(--salvia));
}
.ag-forma .glifo { width: .8125rem; height: .8125rem; }
/* En el calendario, las marcas van en la tinta de su tono (6:1 o más sobre salvia y 5:1 o más sobre linea, con el ratón
   encima: son glifos de 12 px). Ahí el color solo separa lo que tiene tono de lo que no: el tipo de trabajo se lee en la
   agenda, al lado (ver «Límites» en el README). */
.minical .glifo[data-cat] { color: var(--cat-tinta, var(--tinta)); }
.minical .glifo.forma-aviso, .minical .glifo.forma-hecho { color: var(--tinta); }
@container panel (min-width: 66rem) {
  .agenda { display: block; columns: 2; column-gap: 2.25rem; }
  .ag-dia { break-inside: avoid; margin-bottom: .875rem; }
}

/* El foco se dibuja con la misma forma que el elemento */
.indicador:focus-visible { border-radius: var(--radio-l); }
.fila-dentro:focus-visible, .ag-dentro:focus-visible { border-radius: var(--radio); }
.minical-dia:focus-visible { border-radius: .5rem; }
/* En el móvil, las tarjetas del panel con menos margen (así cada día del calendario mide al menos 44 px)
   y el atajo de la demo con una zona táctil de 44 px */
@container panel (width < 32rem) {
  .panel-dia, .panel-lista, .panel-agenda { padding: 1.125rem 1rem 1.25rem; }
  .minical { border-spacing: 2px; width: calc(100% + 4px); margin: -2px; }
  .atajo { min-height: 2.75rem; }
}
/* A 360 px, el calendario aprovecha parte del margen de la tarjeta: así cada día sigue midiendo 44 px.
   A 320, la leyenda junta un poco sus piezas para que «Hoy» no baje sola de línea. */
@container panel (width < 21rem) {
  .minical { border-spacing: 1px; width: calc(100% + 1.5rem); max-width: none; margin: -1px -.75rem; }
  .leyenda { column-gap: .75rem; }
}

/* El globo de las marcas */
.globo { position: absolute; z-index: 60; max-width: min(19rem, calc(100vw - 1rem)); display: grid; gap: .125rem; padding: .5rem .75rem .5625rem; border-radius: var(--radio-s); background: var(--pizarra); color: var(--texto-suave); font-size: var(--t-xs); line-height: 1.45; box-shadow: var(--sombra); }
.globo b { color: var(--tiza); font-size: var(--t-s); }

/* Correo */
.correo { display: grid; grid-template-columns: minmax(17rem, 23rem) minmax(0, 1fr); gap: 1rem; align-items: start; }
.bandeja { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio-l); overflow: hidden; }
.bandeja-cabeza { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .875rem 1rem; border-bottom: 1px solid var(--borde); }
.bandeja-cabeza h2 { font-size: var(--t-m); font-weight: 600; }
.bandeja ul { list-style: none; }
.mensaje {
  width: 100%; display: grid; gap: .25rem; text-align: left; padding: .875rem 1rem; border: 0; border-top: 1px solid var(--borde); background: transparent;
  border-left: 4px solid transparent;
}
.bandeja li:first-child .mensaje { border-top: 0; }
/* La bandeja recorta lo que se sale (overflow): el anillo del foco va por dentro del mensaje, entero (4,2:1 sobre salvia) */
.mensaje:focus-visible { outline-offset: -3px; }
.mensaje:hover { background: var(--tiza); }
/* El abierto, en salvia y con la barra pizarra (un estado, no un tono: ningún filo de color) */
.mensaje[aria-current="true"] { background: var(--salvia); border-left-color: var(--pizarra); }
.mensaje .fila1 { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.mensaje .de { flex: 1; min-width: 0; font-weight: 700; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mensaje .hora { flex: none; font-size: var(--t-xs); color: var(--cuerpo); }
.mensaje .asunto { font-weight: 600; color: var(--tinta); font-size: var(--t-s); }
/* Lo que lleva a una función toma su tono (regla 1 del README): el correo que lleva a una función con tono lleva su punto
   delante del asunto, como en el menú, y en la lectura, el enlace «Ir a «…»» con el punto y el subrayado del medio. El
   punto, con un filo de la tinta (sobre salvia, la mostaza y la turquesa no llegan a 3:1). Lo que ha escrito la IA (el
   resumen, las respuestas) sigue sin tono: su único color es la chispa. */
.mensaje[data-cat]:not([data-cat="comunicacion"]) .asunto::before,
.enlace[data-cat]:not([data-cat="comunicacion"])::before {
  content: ""; display: inline-block; width: .625rem; height: .625rem; margin-right: .5rem; border-radius: 50%;
  background: var(--cat-medio); box-shadow: inset 0 0 0 1.5px var(--cat-tinta); vertical-align: .06em;
}
.enlace[data-cat]:not([data-cat="comunicacion"]) { text-decoration-color: var(--cat-medio); }
.enlace[data-cat]:not([data-cat="comunicacion"]):hover { text-decoration-color: var(--cat-tinta); }
.mensaje .extracto { font-size: var(--t-s); color: var(--cuerpo); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mensaje .fila3 { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .25rem; align-items: center; }
.mensaje.hecho .de, .mensaje.hecho .asunto { color: var(--cuerpo); font-weight: 600; }

.lectura { display: grid; gap: 1rem; min-width: 0; }
.lectura-cabeza { display: grid; gap: .5rem; }
.lectura-cabeza h2 { font-size: var(--t-2xl); font-weight: 600; line-height: 1.2; }
.lectura-cabeza .quien { color: var(--cuerpo); font-size: var(--t-s); }
.lectura-cabeza .quien b { color: var(--tinta); }
.adjuntos { display: flex; flex-wrap: wrap; gap: .5rem; }
.adjunto { display: inline-flex; align-items: center; gap: .375rem; padding: .25rem .75rem; border: 1px solid var(--borde); border-radius: var(--radio-s); background: var(--papel); font-size: var(--t-xs); font-weight: 700; color: var(--tinta); }
.resumen-ia ul { list-style: none; display: grid; gap: .5rem; margin-top: .75rem; }
.resumen-ia li { position: relative; padding-left: 1.125rem; color: var(--tinta); }
.resumen-ia li::before { content: ""; position: absolute; left: 0; top: .62em; width: .4375rem; height: .4375rem; border-radius: 50%; background: var(--cat-medio, var(--pizarra-linea)); }
.piden { margin-top: .875rem; padding-top: .875rem; border-top: 1px solid var(--borde); color: var(--tinta); }
.piden b { display: block; font-size: var(--t-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--cat-tinta, var(--pizarra-linea)); margin-bottom: .125rem; }
details.original { border: 1px solid var(--borde); border-radius: var(--radio); background: var(--papel); }
details.original summary { padding: .75rem 1rem; font-weight: 700; color: var(--tinta); cursor: pointer; }
details.original .texto-original { padding: 0 1rem 1rem; display: grid; gap: .75rem; color: var(--cuerpo); }
.opciones { display: grid; gap: .5rem; margin-top: .75rem; }
.opcion { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; align-items: start; padding: .75rem .875rem; border: 1.5px solid var(--borde); border-radius: var(--radio); background: var(--papel); cursor: pointer; }
.opcion:hover { border-color: var(--pizarra-linea); }
.opcion input { margin: .2rem 0 0; width: 1.125rem; height: 1.125rem; accent-color: var(--pizarra); }
.opcion .t { font-weight: 700; color: var(--tinta); }
.opcion .pre { grid-column: 2; font-size: var(--t-s); color: var(--cuerpo); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.opcion:has(input:checked) { border-color: var(--pizarra); background: var(--tiza); }
.editor { display: grid; gap: .625rem; margin-top: 1rem; }
.editor .linea-campo { display: flex; align-items: baseline; gap: .5rem; font-size: var(--t-s); color: var(--cuerpo); }
.editor .linea-campo b { flex: none; color: var(--tinta); min-width: 3.75rem; }
.editor .linea-campo > span { min-width: 0; }
.editor textarea, .area {
  width: 100%; min-height: 14rem; padding: .875rem 1rem; resize: vertical;
  border: 1.5px solid var(--borde-campo); border-radius: var(--radio); background: var(--papel); color: var(--tinta); line-height: 1.6;
}
.editor textarea:focus, .area:focus { border-color: var(--pizarra); outline: none; box-shadow: 0 0 0 3px var(--foco-halo); }
.acciones { display: flex; flex-wrap: wrap; gap: .625rem; align-items: center; }
.acciones .ayuda { font-size: var(--t-s); color: var(--cuerpo); }
.enviado { display: grid; gap: .5rem; }
.enviado .cuerpo-enviado { padding: .875rem 1rem; border-radius: var(--radio); background: var(--tiza); border: 1px solid var(--borde); color: var(--tinta); display: grid; gap: .5rem; font-size: var(--t-s); }
.volver { display: none; }

/* Módulos: comunes */
.dos-columnas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 21rem); gap: 1rem; align-items: start; }
.lateral { display: grid; gap: 1rem; position: sticky; top: calc(var(--cabecera) + env(safe-area-inset-top, 0px) + 1rem); }
.lista-ia { list-style: none; display: grid; gap: .5rem; margin-top: .625rem; }
.lista-ia li { display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: start; font-size: var(--t-s); color: var(--tinta); }
.lista-ia .insignia { width: 1rem; height: 1rem; margin-top: .15rem; }
.sello { display: flex; gap: .625rem; align-items: center; padding: .75rem 1rem; border-radius: var(--radio); background: var(--salvia); color: var(--tinta); font-weight: 700; font-size: var(--t-s); }

/* Documento */
.papel-doc { background: var(--papel); border: 1px solid var(--borde); border-radius: var(--radio-l); box-shadow: var(--sombra); padding: clamp(1.25rem, 1rem + 2vw, 2.5rem); display: grid; gap: 1rem; min-width: 0; }
.papel-doc .doc-titulo { font-size: var(--t-2xl); font-weight: 600; line-height: 1.2; }
.papel-doc .doc-sub { color: var(--cuerpo); font-size: var(--t-s); margin-top: .25rem; }
.papel-doc .doc-cabeza { padding-bottom: 1rem; border-bottom: 1px solid var(--borde); }
.papel-doc h3 { font-size: var(--t-l); font-weight: 600; margin-top: .25rem; }
.papel-doc p, .papel-doc li { color: var(--tinta); line-height: 1.65; }
.papel-doc ul { display: grid; gap: .375rem; padding-left: 1.25rem; }
.papel-doc .campo { display: grid; grid-template-columns: minmax(7rem, 10rem) 1fr; gap: .25rem 1rem; padding: .5rem 0; border-bottom: 1px dashed var(--borde); }
/* Las etiquetas de los campos, en la tinta del tipo de trabajo (la chispa es solo de la IA) */
.papel-doc .campo dt { font-size: var(--t-s); font-weight: 700; color: var(--cat-tinta, var(--pizarra-linea)); }
.papel-doc .campo dd { margin: 0; color: var(--tinta); }
.papel-doc .parrafo-edit { display: grid; gap: 1rem; padding: .5rem .625rem; margin: 0 -.625rem; border-radius: var(--radio-s); outline: 2px dashed var(--pizarra-linea); }
.papel-doc .parrafo-edit:focus { outline: 3px solid var(--foco); }
.piezas { list-style: none; display: grid; gap: .5rem; }
.pieza { display: grid; grid-template-columns: 1fr auto; gap: .25rem 1rem; align-items: center; padding: .75rem 1rem; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--papel); }
.pieza .n { font-weight: 700; color: var(--tinta); }
.pieza .d { grid-column: 1; font-size: var(--t-s); color: var(--cuerpo); }
.pieza .pastilla { grid-row: 1 / span 2; grid-column: 2; white-space: normal; text-align: center; max-width: 11rem; }
.pieza.falta { background: var(--chispa-suave); border-color: transparent; }

/* Aprobaciones */
.propuestas { list-style: none; display: grid; gap: .75rem; }
.propuesta { display: grid; grid-template-columns: minmax(8rem, 11rem) minmax(0, 1fr) auto; gap: .75rem 1.25rem; align-items: center; padding: 1rem 1.125rem; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
.propuesta .cuando { font-family: var(--f-tit); font-weight: 600; color: var(--cat-tinta, var(--tinta)); line-height: 1.3; }
.propuesta .cuando small { display: block; font-family: var(--f-txt); font-weight: 600; color: var(--cuerpo); font-size: var(--t-s); }
.propuesta .quien { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.propuesta select { min-height: 2.5rem; padding: .25rem 2rem .25rem .75rem; border: 1.5px solid var(--borde-campo); border-radius: var(--radio-s); background: var(--papel); color: var(--tinta); font-weight: 700; }
.propuesta .motivo { grid-column: 2; font-size: var(--t-s); color: var(--cuerpo); display: flex; gap: .5rem; align-items: flex-start; }
.propuesta .motivo .insignia { width: 1rem; height: 1rem; margin-top: .15rem; }
.propuesta .lado { grid-column: 3; grid-row: 1 / span 2; display: grid; gap: .375rem; justify-items: end; }
.propuesta.hecha { background: var(--tiza); }
.contexto { display: flex; gap: 1rem; align-items: center; }
.contexto img { width: 4rem; height: 4rem; flex: none; }
.contexto b { display: block; font-family: var(--f-tit); font-weight: 600; color: var(--tinta); font-size: var(--t-l); }

/* Plazos */
.plazos { list-style: none; display: grid; gap: .625rem; }
.plazo { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: .375rem 1rem; align-items: start; padding: 1rem 1.125rem; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
.plazo .fecha { font-family: var(--f-tit); font-weight: 600; color: var(--cat-tinta, var(--tinta)); line-height: 1.25; }
.plazo .t { font-weight: 700; color: var(--tinta); }
.plazo .d { font-size: var(--t-s); color: var(--cuerpo); margin-top: .125rem; }
.plazo .meta { display: flex; flex-wrap: wrap; gap: .375rem .75rem; margin-top: .5rem; font-size: var(--t-xs); color: var(--cuerpo); align-items: center; }
.plazo .meta .insignia { width: .95rem; height: .95rem; }
.plazo .lado { display: grid; gap: .5rem; justify-items: end; }
.plazo.hecho { background: var(--tiza); }
.plazo.hecho .t { text-decoration: line-through; text-decoration-color: var(--pizarra-linea); }

/* Guías de los protocolos: los pasos numerados en un disco de su tono, como los del recorrido; los que solo van si se
   confirma, con el número en borde discontinuo y detrás de su título. Las etiquetas, en la tinta; nada de estados: es una
   guía, no un caso. */
.guia { display: grid; gap: .875rem; }
.guia > .tarjeta-cabeza { margin-bottom: 0; }
.guia-fuente { font-size: var(--t-s); color: var(--cuerpo); }
.guia-pasos { list-style: none; display: grid; gap: .625rem; }
.guia-paso { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .375rem .875rem; align-items: start; padding: 1rem 1.125rem; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
.guia-num { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--cat-tinte, var(--salvia)); color: var(--cat-tinta, var(--tinta)); box-shadow: inset 0 0 0 2.25px var(--cat-medio, var(--pizarra-linea)); font-family: var(--f-tit); font-weight: 600; font-size: var(--t-s); }
.guia-paso.condicional .guia-num { background: var(--papel); box-shadow: none; border: 2px dashed var(--cat-medio, var(--pizarra-linea)); }
.guia-paso h3 { align-self: center; font-size: var(--t-l); font-weight: 600; line-height: 1.3; }
.guia-datos { grid-column: 2; display: grid; gap: .375rem; margin: 0; }
.guia-datos > div { display: grid; grid-template-columns: minmax(6.5rem, 8rem) minmax(0, 1fr); gap: 1rem; }
.guia-datos dt { font-size: var(--t-s); font-weight: 700; color: var(--cat-tinta, var(--pizarra-linea)); }
.guia-datos dd { margin: 0; font-size: var(--t-s); color: var(--tinta); }
.guia-si { display: flex; align-items: center; gap: .5rem; padding: .5rem 0 0; font-family: var(--f-tit); font-weight: 600; color: var(--tinta); }
.guia-si .glifo { color: var(--cat-tinta, var(--tinta)); }
.ayuda-tarjeta { margin-top: .25rem; font-size: var(--t-s); color: var(--cuerpo); }
.plantillas { list-style: none; display: grid; gap: .5rem; margin-top: .75rem; }
.plantilla { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .125rem .75rem; align-items: center; padding: .625rem .75rem; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--papel); }
.plantilla .n { font-weight: 700; color: var(--tinta); font-size: var(--t-s); }
.plantilla .d { grid-column: 1; font-size: var(--t-xs); color: var(--cuerpo); }
.plantilla .boton { grid-row: 1 / span 2; grid-column: 2; }

/* Justificantes del profesorado: subir el del docente, las carpetas de secretaría y el informe de jefatura. Sin la
   insignia de la IA: lo hace un programa, con reglas. La ruta del archivo, en una píldora de tiza que se parte por las barras. */
.columna { display: grid; gap: 1rem; min-width: 0; }
/* Una sola columna que no crece con el desplegable: en el móvil, el nombre largo de la ausencia no empuja la tarjeta
   hasta el borde (el desplegable se queda en el ancho de la tarjeta). */
.subir-justificante { display: grid; grid-template-columns: minmax(0, 1fr); gap: .875rem; }
.subir-justificante > .tarjeta-cabeza { margin-bottom: 0; }
.campo-j { display: grid; grid-template-columns: minmax(0, 1fr); gap: .375rem; }
.campo-j .etq { font-size: var(--t-s); font-weight: 700; color: var(--cuerpo); }
.campo-j select { justify-self: start; max-width: 100%; min-height: 2.5rem; padding: .25rem 2rem .25rem .75rem; border: 1.5px solid var(--borde-campo); border-radius: var(--radio-s); background: var(--papel); color: var(--tinta); font-weight: 700; }
.archivo-elegido { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; font-weight: 700; color: var(--tinta); }
.archivo-elegido small { font-weight: 600; color: var(--cuerpo); font-size: var(--t-xs); }
.ruta { justify-self: start; max-width: 100%; padding: .25rem .625rem; border-radius: var(--radio-s); background: var(--tiza); border: 1px solid var(--borde); color: var(--tinta); font-size: var(--t-s); font-weight: 600; overflow-wrap: anywhere; }
.pieza .ruta { font-size: var(--t-xs); }
.arbol, .arbol ul { list-style: none; display: grid; gap: .375rem; }
.arbol ul { margin: .375rem 0 0 .4375rem; padding-left: 1rem; border-left: 2px solid var(--linea); }
.carpeta-nombre { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; font-weight: 700; color: var(--tinta); }
.carpeta-nombre .glifo { color: var(--cat-tinta, var(--tinta)); }
.carpeta-nombre small { font-weight: 600; font-size: var(--t-xs); color: var(--cuerpo); }
.arbol .archivo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .125rem .75rem; align-items: center; padding: .5rem .75rem; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--papel); }
.arbol .archivo .n { display: flex; align-items: center; gap: .375rem; min-width: 0; font-weight: 600; font-size: var(--t-s); color: var(--tinta); overflow-wrap: anywhere; }
.arbol .archivo .d { grid-column: 1; font-size: var(--t-xs); color: var(--cuerpo); }
.arbol .archivo .pastilla { grid-row: 1 / span 2; grid-column: 2; }
.arbol .archivo.pendiente { background: transparent; border-style: dashed; border-color: var(--borde-campo); }
.arbol .archivo.pendiente .n { color: var(--cuerpo); }
tbody th.fila-cabeza { text-transform: none; letter-spacing: 0; font-size: var(--t-s); color: var(--tinta); background: var(--papel); white-space: normal; }
/* Lo que el banco comprueba al leer el archivo: con reglas o «con IA», sin la insignia */
.comprobado { list-style: none; display: grid; gap: .375rem; }
.comprobado li { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; font-size: var(--t-s); color: var(--tinta); font-weight: 600; }
.comprobado small { font-size: var(--t-xs); color: var(--cuerpo); font-weight: 600; }
.lista-puntos { list-style: none; display: grid; gap: .375rem; }
.lista-puntos li { position: relative; padding-left: 1.125rem; font-size: var(--t-s); color: var(--tinta); }
.lista-puntos li::before { content: ""; position: absolute; left: 0; top: .6em; width: .375rem; height: .375rem; border-radius: 50%; background: var(--cat-medio, var(--pizarra-linea)); }

/* Banco */
.buscador { display: flex; gap: .5rem; align-items: center; padding: .375rem .375rem .375rem 1.125rem; border: 2px solid var(--pizarra); border-radius: 999px; background: var(--papel); }
.buscador input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: var(--t-l); font-weight: 600; color: var(--tinta); padding: .375rem 0; }
.buscador input:focus { outline: none; }
.buscador:focus-within { outline: 3px solid var(--foco); outline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.chip { display: inline-flex; align-items: center; padding: .25rem .75rem; border: 1.5px solid var(--borde); border-radius: 999px; background: var(--tiza); color: var(--tinta); font-size: var(--t-s); font-weight: 600; }
.chip.sel { background: var(--pizarra); border-color: var(--pizarra); color: var(--tiza); }
.resultados { list-style: none; display: grid; gap: .625rem; }
.resultado { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .375rem 1rem; align-items: center; padding: 1rem 1.125rem; border: 1.5px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
/* El primer resultado, con el borde del medio y el fondo del tinte de su tono */
.resultado.primero { border-color: var(--cat-medio, var(--pizarra-linea)); background: var(--cat-tinte, var(--papel)); }
.resultado .t { font-family: var(--f-tit); font-weight: 600; color: var(--tinta); font-size: var(--t-l); line-height: 1.3; }
.resultado .m { font-size: var(--t-s); color: var(--cuerpo); }
.resultado .cerca { font-size: var(--t-s); font-weight: 700; color: var(--cat-tinta, var(--pizarra-linea)); text-align: right; }
.resultado .lado { display: grid; gap: .5rem; justify-items: end; grid-row: 1 / span 2; grid-column: 2; }
.adaptado { display: grid; gap: .75rem; }
.adaptado ol { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); gap: .625rem; }
.adaptado li { padding: .875rem 1rem; border-radius: var(--radio); background: var(--tiza); border: 1px solid var(--borde); color: var(--tinta); font-size: var(--t-s); line-height: 1.5; }
.formulario { display: grid; gap: .875rem; }
.formulario .campo-f { display: grid; gap: .375rem; padding-bottom: .875rem; border-bottom: 1px solid var(--borde); }
.formulario label.etq, .formulario .etq { font-size: var(--t-s); font-weight: 700; color: var(--cuerpo); }
.formulario .etq b { color: var(--pizarra-linea); }
