.formulario input[type="text"] { width: 100%; min-height: 2.75rem; padding: .5rem .875rem; border: 1.5px solid var(--borde-campo); border-radius: var(--radio-s); background: var(--papel); color: var(--tinta); font-weight: 600; }
.chip-boton { border: 1.5px solid var(--borde-campo); background: var(--tiza); color: var(--tinta); border-radius: 999px; padding: .25rem .875rem; min-height: 2.25rem; font-size: var(--t-s); font-weight: 600; }
.chip-boton[aria-pressed="true"] { background: var(--pizarra); border-color: var(--pizarra); color: var(--tiza); }
.impacto { display: grid; gap: .875rem; }
.impacto .grande { font-family: var(--f-tit); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--tinta); }
.insignias { display: flex; flex-wrap: wrap; gap: .5rem; }
.insignia-logro { padding: .25rem .75rem; border: 1.5px solid var(--cat-medio, var(--pizarra-linea)); border-radius: var(--radio-s); background: var(--cat-tinte, var(--tiza)); color: var(--cat-tinta, var(--tinta)); font-size: var(--t-s); font-weight: 700; }
.barra { height: .75rem; border-radius: 999px; background: var(--salvia); overflow: hidden; }
.barra span { display: block; height: 100%; border-radius: 999px; background: var(--cat-medio, var(--pizarra-linea)); }
.nota-oscura { padding: 1rem 1.25rem; border-radius: var(--radio-l); background: var(--pizarra); color: var(--tiza); font-family: var(--f-tit); font-weight: 500; font-size: var(--t-l); }

/* Dictado */
.dictado-panel { display: grid; gap: 1rem; }
.microfono { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.microfono img { width: 4.5rem; height: 4.5rem; }
.transcripcion { min-height: 6rem; padding: 1rem 1.125rem; border-radius: var(--radio); background: var(--tiza); border: 1px dashed var(--cat-medio, var(--pizarra-linea)); color: var(--tinta); font-style: italic; line-height: 1.6; }
.transcripcion.vacia { color: var(--cuerpo); font-style: normal; }
.escuchando { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; color: var(--tinta); font-size: var(--t-s); }
.escuchando i { width: .625rem; height: .625rem; border-radius: 50%; background: var(--cat-medio, var(--pizarra-linea)); animation: latido 1s ease-in-out infinite; }
@keyframes latido { 50% { transform: scale(1.6); opacity: .5; } }

/* Material */
.nube { display: flex; gap: 1rem; align-items: center; padding: 1rem 1.125rem; border-radius: var(--radio-l); border: 1.5px dashed var(--cat-medio, var(--pizarra-linea)); background: var(--papel); }
.nube img { width: 4rem; height: 4rem; flex: none; }
.bloqueo { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem 1rem; border-radius: var(--radio); background: var(--chispa-suave); color: var(--pizarra); }
.bloqueo img { width: 2.5rem; height: 2.5rem; flex: none; }

/* Ficha (como el componente de la marca) */
.fichas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr)); gap: 1rem; align-items: start; }
.ficha { padding: clamp(1.25rem, 1rem + 1.5vw, 2rem); border: 1px solid var(--linea); border-radius: var(--radio-l); background: var(--papel); box-shadow: var(--sombra); }
.ficha-cabeza { padding-bottom: 1rem; border-bottom: 1px solid var(--linea); }
.ficha-sesion { font-family: var(--f-tit); font-weight: 600; font-size: var(--t-xl); color: var(--pizarra); line-height: 1.25; }
.ficha-hora { font-size: var(--t-s); font-weight: 700; color: var(--cuerpo); margin-top: .125rem; }
.ficha-para { margin-top: .5rem; font-size: var(--t-s); font-weight: 700; color: var(--tinta); }
.ficha-origen { display: flex; align-items: center; gap: .5rem; margin-top: .125rem; font-size: var(--t-s); color: var(--texto); }
.ficha-origen .insignia { width: 1.125rem; height: 1.125rem; }
.ficha-datos { display: grid; gap: 1rem; margin: 1.125rem 0 0; }
/* Como el componente de la marca, salvo las etiquetas: en la app van en la tinta de su tipo de trabajo, porque el
   naranja es solo de la IA y la ficha la prepara DirectorIA con reglas */
.ficha-datos dt { font-size: var(--t-s); font-weight: 700; letter-spacing: .02em; color: var(--cat-tinta, var(--pizarra-linea)); }
.ficha-datos dd { margin: .125rem 0 0; font-size: .96875rem; line-height: 1.5; color: var(--pizarra); }
.ficha-datos .llamar { display: block; }
.ficha-aviso { padding: .875rem 1rem; border-radius: var(--radio); background: var(--chispa-suave); --hueco: var(--chispa-suave); }
/* La línea fija («Antes de empezar»), la misma en todas las fichas: lleva el triángulo delante de su título, como los
   demás avisos, y no se distingue solo por el fondo */
.ficha-aviso dt { display: flex; align-items: center; gap: .375rem; color: var(--pizarra); }
.ficha-pie { margin-top: 1.125rem; padding-top: .875rem; border-top: 1px solid var(--linea); font-size: var(--t-s); color: var(--texto); }
.espera { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
.espera img { width: 6rem; height: 6rem; }
.espera > div { flex: 1; min-width: min(100%, 16rem); display: grid; gap: .625rem; }
.espera .ayuda { font-size: var(--t-s); color: var(--cuerpo); }

/* Tabla */
.tabla-caja { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
table { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
th, td { padding: .75rem .875rem; text-align: left; border-bottom: 1px solid var(--borde); vertical-align: top; color: var(--tinta); }
th { font-weight: 700; color: var(--cat-tinta, var(--pizarra-linea)); font-size: var(--t-xs); letter-spacing: .04em; text-transform: uppercase; background: var(--tiza); white-space: nowrap; }
tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td:first-child { font-weight: 700; }
td.m-aviso { background: var(--chispa-suave); }
td.m-ok { background: var(--salvia); }
.marca-celda { display: inline-grid; place-items: center; width: 1.125rem; height: 1.125rem; margin-right: .375rem; border-radius: 50%; background: var(--pizarra); color: var(--tiza); font-size: .6875rem; font-weight: 700; vertical-align: .05em; }
.lista-avisos { list-style: none; display: grid; gap: .5rem; }
.lista-avisos .marca-celda { flex: none; margin-top: .2rem; }
tbody th { white-space: nowrap; }

/* Informe */
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 1rem; }
.cifra-tarjeta { padding: 1.25rem; border-radius: var(--radio-l); background: var(--papel); border: 1px solid var(--borde); display: grid; gap: .375rem; }
.cifra-tarjeta .v { font-family: var(--f-tit); font-size: var(--t-2xl); font-weight: 600; color: var(--tinta); line-height: 1.1; font-variant-numeric: tabular-nums; }
.cifra-tarjeta .t { font-size: var(--t-s); color: var(--cuerpo); }
.avisos-informe { list-style: none; display: grid; gap: .625rem; }
.aviso-informe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem .875rem; padding: 1rem 1.125rem; border: 1px solid var(--borde); border-radius: var(--radio-l); background: var(--papel); }
.aviso-informe .t { font-weight: 700; color: var(--tinta); }
.aviso-informe .d { grid-column: 2; font-size: var(--t-s); color: var(--cuerpo); }
.aviso-informe .pastilla { min-width: 6.75rem; justify-content: center; margin-top: .125rem; }
td.importe, th.importe { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Traducción */
.version { display: grid; gap: .75rem; }
.version p { color: var(--tinta); line-height: 1.7; }
.version.facil p { font-size: var(--t-l); line-height: 1.75; }
.version.facil .doc-sub { font-size: var(--t-s); line-height: 1.5; }

/* Ventana de confirmación y avisos */
dialog.confirmar { width: min(36rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); padding: 0; border: 0; border-radius: var(--radio-l); background: var(--papel); color: var(--cuerpo); box-shadow: 0 24px 64px -16px var(--velo); }
dialog.confirmar::backdrop { background: var(--velo); }
.confirmar-dentro { display: grid; gap: 1rem; padding: 1.5rem; }
.confirmar-dentro h2 { font-size: var(--t-xl); font-weight: 600; }
#confirmar-titulo:focus { outline: none; }
.vista-previa { max-height: 40vh; overflow: auto; padding: .875rem 1rem; border-radius: var(--radio); background: var(--tiza); border: 1px solid var(--borde); color: var(--tinta); display: grid; gap: .5rem; font-size: var(--t-s); }
/* Los avisos no recogen toques: en el móvil quedan encima de lo último que se ha tocado (otro «Marcar como hecho»,
   «Deshacer»…) y el toque tiene que llegar a lo de debajo. No llevan nada que pulsar. */
.avisos-flotantes { position: fixed; z-index: 50; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: max(1rem, env(safe-area-inset-bottom, 0px)); display: grid; gap: .5rem; width: min(26rem, calc(100vw - 2rem)); pointer-events: none; }
.flotante { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem 1rem; border-radius: var(--radio); background: var(--pizarra); color: var(--tiza); box-shadow: var(--sombra); font-size: var(--t-s); pointer-events: none; animation: entra .25s ease-out; }
.flotante b { display: block; }
.flotante .visto { margin-top: .1rem; }
@keyframes entra { from { opacity: 0; transform: translateY(.5rem); } }

/* ---------- Pantallas medianas y móviles ---------- */
/* Hasta 1279 px, el menú pasa a una fila bajo la cabecera. Con el menú al lado, en una tableta apaisada (1180 px) o en un
   portátil con el zoom al 110 % (1242 px), el panel no llegaba a 62rem y el día de 3.º B salía en filas casi vacías. */
@media (max-width: 1279px) {
  .cuerpo { grid-template-columns: minmax(0, 1fr); }
  .menu { border-right: 0; border-bottom: 1px solid var(--borde); padding: .5rem 0; gap: 0; }
  .menu nav { overflow-x: auto; scrollbar-width: thin; }
  .menu nav ul { display: flex; gap: .25rem; width: max-content; padding: .25rem max(16px, env(safe-area-inset-right, 0px)) .25rem max(16px, env(safe-area-inset-left, 0px)); }
  .menu nav a { white-space: nowrap; min-height: 2.5rem; }
  /* En fila no hace falta alinear los nombres: el Inicio y el correo, sin el hueco del punto */
  .menu nav a:not([data-cat])::before, .menu nav a[data-cat="comunicacion"]::before { display: none; }
  /* La barra se desplaza de lado (overflow): el anillo del foco va por dentro de la píldora, para que no se recorte */
  .menu nav a:focus-visible { outline-offset: -3px; }
  /* Por dentro de la píldora pizarra de la sección abierta, el anillo va en chispa (4,6:1 sobre pizarra), como en la banda oscura */
  .menu nav a[aria-current="page"]:focus-visible { outline-color: var(--chispa); }
  .menu .grupo, .menu-pie { display: none; }
}
@media (max-width: 1100px) {
  .dos-columnas { grid-template-columns: minmax(0, 1fr); }
  .lateral { position: static; }
  .chip-hora { display: none; }
  .cabeza-ilus { width: 6.5rem; height: 6.5rem; }
  /* Al desplazar de lado una tabla con cabecera de fila (MODULOS.tabla), la columna del grupo se queda fija.
     La tabla de gastos no tiene cabecera de fila: su primera columna se desplaza con las demás. */
  .tabla-caja.columna-fija thead th:first-child, .tabla-caja.columna-fija tbody th { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--borde); }
}
@media (max-width: 900px) {
  .acceso { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "arriba" "perfiles" "abajo"; }
  .acceso-banda { gap: 1.5rem; }
  .acceso-arriba { padding-block: 1.75rem; }
  .acceso-abajo { padding-block: 1.75rem; }
  .acceso-pie { margin-top: 0; }
  .correo { grid-template-columns: minmax(0, 1fr); }
  .correo.leyendo .bandeja { display: none; }
  .correo:not(.leyendo) .lectura { display: none; }
  .volver { display: inline-flex; justify-self: start; }
  .cabecera .colegio, .chip-servidor span.largo { display: none; }
}
@media (max-width: 640px) {
  :root { --cabecera: 3.5rem; }
  /* El logotipo es el botón para volver a elegir perfil: 44 px de alto, como las demás zonas táctiles */
  .cabecera .logo-boton { min-height: 2.75rem; }
  .perfil { grid-template-columns: 4.5rem minmax(0, 1fr); grid-template-rows: auto; column-gap: 1rem; row-gap: .25rem; align-items: start; }
  .perfil img { grid-row: 1 / span 4; width: 4.5rem; height: 4.5rem; margin: 0; }
  .perfil > span { grid-column: 2; }
  .perfil .cargo { font-size: var(--t-l); }
  .cabecera { gap: .625rem; }
  .cabecera .logo { width: 7rem; }
  .cabecera .boton-pequeno, .menu nav a { min-height: 2.75rem; }
  .chip-servidor { display: none; }
  .usuario > div { display: none; }
  .propuesta { grid-template-columns: minmax(0, 1fr); }
  .propuesta .motivo, .propuesta .lado { grid-column: 1; grid-row: auto; justify-items: start; }
  .plazo { grid-template-columns: minmax(0, 1fr); }
  .plazo .lado { justify-items: start; }
  .resultado { grid-template-columns: minmax(0, 1fr); }
  .resultado .lado { grid-column: 1; grid-row: auto; justify-items: start; }
  .resultado .cerca { text-align: left; }
  .papel-doc .campo { grid-template-columns: minmax(0, 1fr); }
  .item { grid-template-columns: minmax(0, 1fr); }
  .item .ir { grid-column: 1; }
  .item .pastilla { justify-self: start; }
  .aviso-informe { grid-template-columns: minmax(0, 1fr); }
  .aviso-informe .d { grid-column: 1; }
  .aviso-informe .pastilla { justify-self: start; }
  /* Guías y justificantes: en el móvil, cada dato debajo de su etiqueta y el estado del archivo debajo de su nombre */
  .guia-paso { padding: .875rem 1rem; }
  .guia-datos { grid-column: 1 / -1; }
  .guia-datos > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .arbol ul { margin-left: .25rem; padding-left: .625rem; }
  .arbol .archivo { grid-template-columns: minmax(0, 1fr); }
  .arbol .archivo .pastilla { grid-row: auto; grid-column: 1; justify-self: start; }
  .principal { padding-block: 1.5rem 3rem; }
  .principal-inicio { padding-top: 1.25rem; }
  .cabeza-inicio { grid-template-columns: minmax(0, 1fr); }
  .cabeza-ilus { display: none; }
  .cabeza-inicio .origen { display: block; }
  .cabeza-inicio .origen .sep { display: none; }
  /* En el móvil, la cabecera de una función va sin icono: la raya del antetítulo abre la línea, como pide la marca, y el
     punto de color de la función ya está en el menú, justo encima. El título conserva todo el ancho. */
  .cabeza-vista.con-icono { grid-template-columns: minmax(0, 1fr); }
  .cabeza-vista.con-icono > .ico { display: none; }
  .cabeza-vista.con-icono > .titulo-vista { grid-column: 1; }
}
@media (min-width: 641px) and (max-height: 800px) {
  .principal-inicio { padding-top: .75rem; }
}
/* Pantallas bajas (un portátil de 1366×768 con el zoom al 110 %, 1242×698; un proyector de 1280×720): la cabecera y los
   márgenes se recogen un poco, y la ilustración baja a 96 px, para que la fila de 3.º B quepa entera en la primera pantalla */
@media (min-width: 641px) and (max-height: 720px) {
  .principal-inicio { padding-top: .5rem; }
  .principal-inicio .principal-dentro, .principal-inicio .panel { gap: .875rem; }
  .cabeza-inicio .titulo-vista { font-size: 2rem; }
  .cabeza-ilus { width: 6rem; height: 6rem; }
  .principal-inicio .indicador { padding-top: .75rem; padding-bottom: .875rem; }
  .principal-inicio .panel-dia { padding-top: 1rem; }
  .principal-inicio .panel-dia .panel-cabeza { margin-bottom: .625rem; }
}
/* Ventanas aún más bajas (un portátil de 1366×768 con el navegador maximizado, 1366×643; un proyector de 1280×720 en una
   ventana, 1280×633): el saludo y la entradilla van en una línea y la ilustración, a 96 px, se mete en el margen. Así, tras
   confirmar, «Confirmada a las 8:01» de la fila de 3.º B sigue en la primera pantalla. */
@media (min-width: 641px) and (max-height: 700px) {
  .principal-inicio .cabeza-inicio-texto { grid-template-columns: auto minmax(0, 1fr); align-items: baseline; column-gap: 1rem; }
  .principal-inicio .cabeza-inicio .antetitulo { grid-column: 1 / -1; }
  .principal-inicio .cabeza-inicio .titulo-vista { font-size: 1.75rem; }
  .principal-inicio .cabeza-inicio .entradilla { font-size: var(--t-m); }
  .principal-inicio .cabeza-ilus { width: 6rem; height: 6rem; margin-block: -.5rem -1.5rem; align-self: start; }
  .principal-inicio .principal-dentro, .principal-inicio .panel { gap: .75rem; }
  .principal-inicio .indicador { padding-top: .625rem; padding-bottom: .75rem; row-gap: .25rem; }
  .principal-inicio .panel-dia { padding-top: .875rem; }
}
/* Con el menú en fila y muy poca altura (1366×768 con el zoom al 110 %, 1242×607), el menú se recoge un poco. Solo con
   ratón o panel táctil del portátil: en una tableta (pantalla táctil), sus enlaces siguen midiendo 44 px. */
@media (min-width: 641px) and (max-width: 1279px) and (max-height: 660px) and (pointer: fine) {
  .menu { padding-block: .25rem; }
  .menu nav a { min-height: 2.25rem; padding-block: .25rem; }
}
/* En un móvil estrecho (360 px): «Cambiar» en una línea (su nombre sigue siendo «Cambiar de perfil»), la fecha corta en el
   antetítulo, «Preparado por…» en una línea pequeña y la entradilla en letra normal. Así las cifras caben en la primera pantalla. */
.cambiar-corto, .ante-corto { display: none; }
@media (max-width: 367px) {
  .cambiar-largo, .ante-largo { display: none; }
  .cambiar-corto, .ante-corto { display: inline; }
  .cabeza-inicio .origen { font-size: var(--t-xs); letter-spacing: 0; }
  .cabeza-inicio .entradilla { font-size: var(--t-m); line-height: 1.5; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .perfil:hover { transform: none; }
}

</style>
