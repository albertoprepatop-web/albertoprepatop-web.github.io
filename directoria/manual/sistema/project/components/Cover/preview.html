<!-- @dsCard height=300 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--fondo)}
.cv-svg{position:absolute;left:480px;top:0;display:block}
.b-losa{fill:var(--inverso-fondo);rx:var(--radio-l)}
.b-chispa{fill:var(--chispa);rx:var(--radio-l)}
.b-linea{fill:var(--pizarra-linea);rx:var(--radio-l)}
.d{fill:var(--fondo)}
.d-ia{fill:var(--inverso-acento)}
.cv-txt{position:absolute;left:40px;bottom:44px;width:440px}
.cv-logo{display:block;width:400px;height:auto}
.cv-neg{display:none}
[data-theme="oscuro"] .cv-pos{display:none}
[data-theme="oscuro"] .cv-neg{display:block}
</style>
<svg class="cv-svg" width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<!-- bloques: inverso-fondo 256×340 (el grande, con los discos), chispa 184×128 y pizarra-linea 128×140; esquinas radio-l (24) -->
<!-- disposición: una losa alta que sangra arriba y abajo, con dos satélites a la derecha; chispa sangra por la derecha y pizarra-linea por abajo -->
<!-- motivo: los discos de las ilustraciones de la marca, en rejilla tranquila; uno, más pequeño y en inverso-acento, es la chispa de la IA (el punto de documento-ia y de la luz del servidor). Sin agujas sueltas: la aguja solo vive dentro del logotipo -->
<!-- escalas: paso de 64 (seccion-min) en horizontal y 96 en vertical, huecos de 32 (diapo-hueco); discos de radio 20 y punto de radio 12 -->
<rect class="b-losa" x="32" y="-20" width="256" height="340"/>
<rect class="b-chispa" x="320" y="24" width="184" height="128"/>
<rect class="b-linea" x="320" y="184" width="128" height="140"/>
<circle class="d" cx="64" cy="56" r="20"/><circle class="d" cx="128" cy="56" r="20"/><circle class="d" cx="192" cy="56" r="20"/><circle class="d" cx="256" cy="56" r="20"/><circle class="d" cx="64" cy="152" r="20"/><circle class="d" cx="128" cy="152" r="20"/><circle class="d-ia" cx="192" cy="152" r="12"/><circle class="d" cx="256" cy="152" r="20"/><circle class="d" cx="64" cy="248" r="20"/><circle class="d" cx="128" cy="248" r="20"/><circle class="d" cx="192" cy="248" r="20"/><circle class="d" cx="256" cy="248" r="20"/>
</svg>
<div class="cv-txt"><img class="cv-logo cv-pos" src="/_blob/cb0e08d651b3cbc9951e4d578b7b6266" alt="DirectorIA. Vuestra IA, dentro del colegio" width="400" height="106"><img class="cv-logo cv-neg" src="/_blob/27d08f9aad130d7d466069d71d6fee93" alt="DirectorIA. Vuestra IA, dentro del colegio" width="400" height="106"></div>
</div>
