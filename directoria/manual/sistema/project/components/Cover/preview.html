<!-- @dsCard height=300 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--fondo)}
.cv-svg{position:absolute;left:480px;top:0;display:block}
.b-losa{fill:var(--inverso-fondo);rx:var(--radio-l)}
.b-chispa{fill:var(--chispa);rx:var(--radio-l)}
.b-linea{fill:var(--pizarra-linea);rx:var(--radio-l)}
.n{fill:var(--fondo);stroke:var(--fondo);stroke-width:2;stroke-linejoin:round}
.n-ia{fill:var(--inverso-acento);stroke:var(--inverso-acento);stroke-width:2;stroke-linejoin:round}
.cv-txt{position:absolute;left:40px;bottom:40px;width:440px}
.cv-nombre{margin:0;font-family:var(--font-titulares);font-size:72px;font-weight:600;line-height:.95;letter-spacing:-.01em;color:var(--tinta)}
.cv-lema{margin:14px 0 0;font-family:var(--font-texto);font-size:14px;line-height:1.3;color:var(--cuerpo)}
</style>
<svg class="cv-svg" width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<!-- bloques: inverso-fondo 256×340 (el grande, con las agujas), chispa 184×128 y pizarra-linea 128×140; esquinas radio-l (24) -->
<!-- disposición: una losa alta que sangra arriba y abajo, con dos satélites a la derecha; chispa sangra por la derecha y pizarra-linea por abajo -->
<!-- motivo: la aguja de brújula del logotipo, apuntando al norte (calma y orden); once en fondo y una con la punta en inverso-acento: «la IA orienta; vosotros decidís» -->
<!-- escalas: paso de 64 (seccion-min) en horizontal y 96 en vertical, huecos de 32 (diapo-hueco), agujas de 24 × 80 (proporción del isotipo) -->
<rect class="b-losa" x="32" y="-20" width="256" height="340"/>
<rect class="b-chispa" x="320" y="24" width="184" height="128"/>
<rect class="b-linea" x="320" y="184" width="128" height="140"/>
<path class="n" d="M64 16L76 56L52 56Z"/><path class="n" d="M52 56L76 56L64 96Z"/><path class="n" d="M128 16L140 56L116 56Z"/><path class="n" d="M116 56L140 56L128 96Z"/><path class="n" d="M192 16L204 56L180 56Z"/><path class="n" d="M180 56L204 56L192 96Z"/><path class="n" d="M256 16L268 56L244 56Z"/><path class="n" d="M244 56L268 56L256 96Z"/><path class="n" d="M64 112L76 152L52 152Z"/><path class="n" d="M52 152L76 152L64 192Z"/><path class="n" d="M128 112L140 152L116 152Z"/><path class="n" d="M116 152L140 152L128 192Z"/><path class="n-ia" d="M192 112L204 152L180 152Z"/><path class="n" d="M180 152L204 152L192 192Z"/><path class="n" d="M256 112L268 152L244 152Z"/><path class="n" d="M244 152L268 152L256 192Z"/><path class="n" d="M64 208L76 248L52 248Z"/><path class="n" d="M52 248L76 248L64 288Z"/><path class="n" d="M128 208L140 248L116 248Z"/><path class="n" d="M116 248L140 248L128 288Z"/><path class="n" d="M192 208L204 248L180 248Z"/><path class="n" d="M180 248L204 248L192 288Z"/><path class="n" d="M256 208L268 248L244 248Z"/><path class="n" d="M244 248L268 248L256 288Z"/>
</svg>
<div class="cv-txt"><p class="cv-nombre">DirectorIA</p><p class="cv-lema">Vuestra IA, dentro del colegio</p></div>
</div>
