<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DirectorIA · Fondo de perfil de LinkedIn (1584 × 396)</title>
<link rel="stylesheet" href="redes.css">
<style>
  /* 1584 × 396, fondo del perfil personal. LinkedIn tapa abajo a la izquierda con la foto de perfil
     (en escritorio, unos x 47-362 · y 175-396; en móvil, hasta x ≈ 490): el tercio izquierdo
     (x < 560) queda libre a propósito. Disco de la ilustración: 300 px, a unos 87 px del borde derecho.
     Logotipo: solo la palabra (logotipo-negativo.svg) a 52 px de alto (1 x = 40 px). En el móvil LinkedIn
     muestra el fondo a 390 px de ancho (×0,246): la palabra mide 12,8 px, por encima de su mínimo de 12 px.
     El horizontal se quedaría en 14 px, por debajo de sus 24 px (construccion.md). */
  body { width: 1584px; height: 396px; }
  .texto { position: absolute; left: 596px; top: 0; height: 396px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .logo { height: 52px; width: auto; }
  .titular { font-size: 62px; line-height: 1.08; margin-top: 38px; }
  .descriptor { font-size: 28px; font-weight: 600; line-height: 1.3; color: var(--texto-suave); margin-top: 16px; }
  .ilustracion { position: absolute; width: 346px; height: 346px; left: 1170px; top: 25px; }
</style>
</head>
<body class="oscuro">
  <div class="texto">
    <img class="logo" src="../../../logo/logotipo-negativo.svg" alt="DirectorIA">
    <h1 class="titular">Vuestra IA,<br>dentro del colegio</h1>
    <p class="descriptor">IA para dirección y claustro</p>
  </div>
  <img class="ilustracion" src="../../../ilustraciones/colegio-servidor.svg" alt="">
</body>
</html>
