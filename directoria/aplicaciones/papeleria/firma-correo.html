<!doctype html>

<title>Firma de correo · DirectorIA</title>
<!--
  Firma de correo de DirectorIA.
  1. Cambiad los textos entre corchetes, también [dominio.es] en la dirección de la imagen.
  2. La imagen tiene que estar publicada en la web (https). Subid logo/png/logotipo-firma-2x.png
     a vuestra web, en /directoria/logo/png/.
  3. Abrid este archivo en el navegador, seleccionad todo (Ctrl+A o Cmd+A), copiad y pegadlo
     en el editor de firmas de Gmail u Outlook. Los pasos están en el README.md de esta carpeta.
  Todo va en tablas y con estilos en línea, porque es lo que respetan los programas de correo.
  Área de respeto: entre el logotipo y los textos de arriba y de abajo quedan al menos 16 px
  (1 x, la altura de la I a 118 × 20 px). No bajéis el padding de la fila del logotipo (14px)
  ni el de la fila del eslogan (12px).
-->
</head>
<body style="margin:0; padding:24px; background-color:#FFFFFF;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
  <tr>
    <td style="padding:0; font-family:'Nunito Sans', Arial, Helvetica, sans-serif; font-size:16px; line-height:21px; mso-line-height-rule:exactly; font-weight:bold; color:#17322C;">[Tu nombre]</td>
  </tr>
  <tr>
    <td style="padding:2px 0 0 0; font-family:'Nunito Sans', Arial, Helvetica, sans-serif; font-size:13px; line-height:18px; mso-line-height-rule:exactly; color:#41524D;">[Cargo] · DirectorIA</td>
  </tr>
  <tr>
    <td style="padding:14px 0 0 0; line-height:0; font-size:0;">
      <img src="https://[dominio.es]/directoria/logo/png/logotipo-firma-2x.png" width="118" height="20" alt="DirectorIA" style="display:block; width:118px; height:20px; border:0; outline:none; text-decoration:none;">
    </td>
  </tr>
  <tr>
    <td style="padding:12px 0 0 0; font-family:'Nunito Sans', Arial, Helvetica, sans-serif; font-size:12px; line-height:16px; mso-line-height-rule:exactly; color:#41524D;">Vuestra IA, dentro del colegio</td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0; font-family:'Nunito Sans', Arial, Helvetica, sans-serif; font-size:13px; line-height:19px; mso-line-height-rule:exactly; color:#41524D;">
      <a href="tel:[teléfono]" style="color:#41524D; text-decoration:none;">[teléfono]</a><br>
      <a href="mailto:[correo@dominio.es]" style="color:#B4531C; text-decoration:none;">[correo@dominio.es]</a><br>
      <a href="https://[dominio.es]" style="color:#B4531C; text-decoration:none;">[dominio.es]</a>
    </td>
  </tr>
  <tr>
    <td style="padding:14px 0 0 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="420" style="border-collapse:collapse; width:420px; max-width:100%;">
        <tr>
          <td style="padding:10px 0 0 0; border-top:1px solid #D5DED9; font-family:'Nunito Sans', Arial, Helvetica, sans-serif; font-size:11px; line-height:15px; mso-line-height-rule:exactly; color:#41524D;">Este mensaje y sus anexos son confidenciales y van dirigidos solo a su destinatario. Si lo ha recibido por error, comuníqueselo al remitente y bórrelo, por favor.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
